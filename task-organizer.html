<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Classes</title>
<style>
  :root {
    --bg: #FAFAF8;
    --surface: #FFFFFF;
    --surface-raised: #FFFFFF;
    --border: rgba(20,20,18,0.08);
    --border-strong: rgba(20,20,18,0.14);
    --text-primary: #1C1C1A;
    --text-secondary: #6B6B66;
    --text-muted: #A3A39C;
    --shadow: 0 1px 2px rgba(20,20,18,0.04), 0 1px 8px rgba(20,20,18,0.03);
    --shadow-lift: 0 4px 16px rgba(20,20,18,0.08), 0 1px 3px rgba(20,20,18,0.06);
    --radius-card: 18px;
    --radius-control: 12px;
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, sans-serif;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #171715;
    --surface: #201F1D;
    --surface-raised: #262523;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text-primary: #F2F1ED;
    --text-secondary: #9C9B96;
    --text-muted: #6E6D68;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 1px 8px rgba(0,0,0,0.15);
    --shadow-lift: 0 8px 24px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.3);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  #root { height: 100%; }
  button { font-family: inherit; }
  ::selection { background: rgba(120,120,255,0.25); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react,env">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ---------- persistence ---------- */

const STORAGE_KEY = "classesApp.v1";

const DEFAULT_CLASSES = [];

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return {
    classes: DEFAULT_CLASSES,
    tasks: [],
    theme: "system",
  };
}

function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
}

function uid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

const PALETTE = ["#7C86D6", "#C97B63", "#5FAE8C", "#CB8A4F", "#B96C93", "#6FA5C4", "#9C8555", "#8B7FC7", "#6BA888", "#C67A7A"];

/* ---------- icons ---------- */

function Icon({ name, size = 20, style }) {
  const paths = {
    plus: <path d="M12 5v14M5 12h14" />,
    check: <path d="M20 6L9 17l-5-5" />,
    chevron: <path d="M9 6l6 6-6 6" />,
    settings: <><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.14.36.4.66.73.86.24.14.5.22.78.24H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" /></>,
    list: <><line x1="8" y1="6" x2="21" y2="6" /><line x1="8" y1="12" x2="21" y2="12" /><line x1="8" y1="18" x2="21" y2="18" /><circle cx="3.5" cy="6" r="1.5" fill="currentColor" stroke="none" /><circle cx="3.5" cy="12" r="1.5" fill="currentColor" stroke="none" /><circle cx="3.5" cy="18" r="1.5" fill="currentColor" stroke="none" /></>,
    grid: <><rect x="3" y="3" width="7" height="7" rx="2" /><rect x="14" y="3" width="7" height="7" rx="2" /><rect x="3" y="14" width="7" height="7" rx="2" /><rect x="14" y="14" width="7" height="7" rx="2" /></>,
    trash: <><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" /></>,
    edit: <><path d="M12 20h9" /><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z" /></>,
    x: <><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>,
    sun: <><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></>,
    moon: <path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z" />,
    monitor: <><rect x="2" y="4" width="20" height="13" rx="2" /><line x1="8" y1="21" x2="16" y2="21" /><line x1="12" y1="17" x2="12" y2="21" /></>,
    arrowLeft: <path d="M19 12H5M12 19l-7-7 7-7" />,
    grip: <><circle cx="9" cy="6" r="1" fill="currentColor" stroke="none" /><circle cx="15" cy="6" r="1" fill="currentColor" stroke="none" /><circle cx="9" cy="12" r="1" fill="currentColor" stroke="none" /><circle cx="15" cy="12" r="1" fill="currentColor" stroke="none" /><circle cx="9" cy="18" r="1" fill="currentColor" stroke="none" /><circle cx="15" cy="18" r="1" fill="currentColor" stroke="none" /></>,
    bell: <><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.7 21a2 2 0 01-3.4 0" /></>,
    download: <><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></>,
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>
      {paths[name]}
    </svg>
  );
}

/* ---------- checkbox with completion animation ---------- */

function TaskCheckbox({ checked, onToggle, color }) {
  return (
    <button
      onClick={onToggle}
      aria-label={checked ? "Mark task incomplete" : "Mark task complete"}
      style={{
        width: 26, height: 26, borderRadius: "50%",
        border: `2px solid ${checked ? color : "var(--border-strong)"}`,
        background: checked ? color : "transparent",
        display: "flex", alignItems: "center", justifyContent: "center",
        flexShrink: 0, cursor: "pointer", padding: 0,
        transition: "all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1)",
        transform: checked ? "scale(1.02)" : "scale(1)",
      }}
    >
      <span style={{
        display: "flex", opacity: checked ? 1 : 0,
        transform: checked ? "scale(1)" : "scale(0.5)",
        transition: "all 0.18s ease 0.05s",
        color: "#fff",
      }}>
        <Icon name="check" size={14} style={{ strokeWidth: 3 }} />
      </span>
    </button>
  );
}

/* ---------- task row ---------- */

function TaskRow({ task, color, onToggle, onDelete }) {
  const [leaving, setLeaving] = useState(false);
  const [height, setHeight] = useState(null);
  const ref = useRef(null);

  const handleToggle = () => {
    if (!task.done) {
      setLeaving(true);
      if (ref.current) setHeight(ref.current.offsetHeight);
      setTimeout(() => onToggle(task.id), 320);
    } else {
      onToggle(task.id);
    }
  };

  return (
    <div
      ref={ref}
      style={{
        display: "flex", alignItems: "center", gap: 12,
        padding: "13px 4px",
        borderBottom: "1px solid var(--border)",
        opacity: leaving ? 0 : 1,
        transform: leaving ? "translateX(24px) scale(0.98)" : "translateX(0) scale(1)",
        maxHeight: leaving ? 0 : (height ? height + 40 : 80),
        paddingTop: leaving ? 0 : 13,
        paddingBottom: leaving ? 0 : 13,
        overflow: "hidden",
        transition: "opacity 0.28s ease, transform 0.28s cubic-bezier(0.4,0,0.2,1), max-height 0.32s cubic-bezier(0.4,0,0.2,1) 0.02s, padding 0.32s ease",
      }}
    >
      <TaskCheckbox checked={task.done} onToggle={handleToggle} color={color} />
      <span style={{
        flex: 1, fontSize: 15.5, lineHeight: 1.4,
        color: task.done ? "var(--text-muted)" : "var(--text-primary)",
        textDecoration: task.done ? "line-through" : "none",
        transition: "color 0.2s ease",
        wordBreak: "break-word",
      }}>
        {task.title}
      </span>
      <button
        onClick={() => onDelete(task.id)}
        aria-label="Delete task"
        style={{
          background: "none", border: "none", cursor: "pointer",
          color: "var(--text-muted)", padding: 6, borderRadius: 8,
          display: "flex", opacity: 0.6, transition: "opacity 0.15s ease",
          flexShrink: 0,
        }}
        onMouseEnter={e => e.currentTarget.style.opacity = 1}
        onMouseLeave={e => e.currentTarget.style.opacity = 0.6}
      >
        <Icon name="x" size={15} />
      </button>
    </div>
  );
}

/* ---------- quick add input ---------- */

function QuickAdd({ onAdd, placeholder, autoFocus, onCancel }) {
  const [value, setValue] = useState("");
  const inputRef = useRef(null);

  useEffect(() => {
    if (autoFocus && inputRef.current) inputRef.current.focus();
  }, [autoFocus]);

  const submit = () => {
    const trimmed = value.trim();
    if (trimmed) {
      onAdd(trimmed);
      setValue("");
      if (inputRef.current) inputRef.current.focus();
    }
  };

  return (
    <div style={{
      display: "flex", alignItems: "center", gap: 10,
      background: "var(--surface)",
      border: "1.5px solid var(--border-strong)",
      borderRadius: "var(--radius-control)",
      padding: "11px 14px",
    }}>
      <input
        ref={inputRef}
        value={value}
        onChange={e => setValue(e.target.value)}
        onKeyDown={e => {
          if (e.key === "Enter") submit();
          if (e.key === "Escape") { setValue(""); onCancel && onCancel(); }
        }}
        placeholder={placeholder || "What do you need to do?"}
        style={{
          flex: 1, border: "none", outline: "none", background: "transparent",
          fontSize: 15.5, color: "var(--text-primary)", fontFamily: "inherit",
        }}
      />
      {value.trim() && (
        <button
          onClick={submit}
          style={{
            background: "var(--text-primary)", color: "var(--bg)",
            border: "none", borderRadius: 8, width: 30, height: 30,
            display: "flex", alignItems: "center", justifyContent: "center",
            cursor: "pointer", flexShrink: 0,
          }}
        >
          <Icon name="check" size={15} style={{ strokeWidth: 3 }} />
        </button>
      )}
    </div>
  );
}

/* ---------- class card (dashboard) ---------- */

function ClassCard({
  cls, activeTasks, expanded, onToggleExpand, onOpenFull,
  dragHandleProps, isDragging, isDropTarget,
  onQuickAdd,
}) {
  const count = activeTasks.length;
  const preview = activeTasks.slice(0, 3);
  const extra = count - preview.length;

  return (
    <div
      style={{
        background: "var(--surface)",
        border: isDropTarget ? "1.5px solid var(--border-strong)" : "1px solid var(--border)",
        borderRadius: "var(--radius-card)",
        boxShadow: isDragging ? "var(--shadow-lift)" : "var(--shadow)",
        opacity: isDragging ? 0.55 : 1,
        transition: "box-shadow 0.15s ease, border-color 0.12s ease, opacity 0.15s ease",
        overflow: "hidden",
      }}
    >
      <div style={{ display: "flex", alignItems: "center" }}>
        <div
          {...dragHandleProps}
          aria-label={`Reorder ${cls.name}`}
          style={{
            display: "flex", alignItems: "center", justifyContent: "center",
            width: 34, alignSelf: "stretch", color: "var(--text-muted)",
            cursor: "grab", touchAction: "none", flexShrink: 0,
          }}
        >
          <Icon name="grip" size={16} />
        </div>
        <button
          onClick={onToggleExpand}
          style={{
            display: "flex", alignItems: "center", gap: 14,
            background: "transparent", border: "none",
            padding: "16px 18px 16px 2px",
            cursor: "pointer", textAlign: "left",
            width: "100%",
          }}
        >
          <div style={{
            width: 10, height: 10, borderRadius: "50%",
            background: cls.color, flexShrink: 0,
          }} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 16, fontWeight: 600, color: "var(--text-primary)", letterSpacing: "-0.01em" }}>
              {cls.name}
            </div>
            {count === 0 ? (
              <div style={{ fontSize: 13, color: "var(--text-secondary)", marginTop: 2 }}>
                All caught up
              </div>
            ) : (
              <div style={{ marginTop: 4, display: "flex", flexDirection: "column", gap: 2 }}>
                {preview.map(t => (
                  <div key={t.id} style={{
                    display: "flex", alignItems: "center", gap: 6,
                    fontSize: 12.5, color: "var(--text-secondary)",
                    overflow: "hidden",
                  }}>
                    <span style={{
                      width: 4, height: 4, borderRadius: "50%",
                      background: "var(--text-muted)", flexShrink: 0,
                    }} />
                    <span style={{
                      whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
                    }}>
                      {t.title}
                    </span>
                  </div>
                ))}
                {extra > 0 && (
                  <div style={{ fontSize: 12.5, color: "var(--text-muted)", marginLeft: 10 }}>
                    +{extra} more
                  </div>
                )}
              </div>
            )}
          </div>
          {count > 0 && (
            <div style={{
              minWidth: 26, height: 26, borderRadius: 13, padding: "0 8px",
              background: `${cls.color}22`, color: cls.color,
              display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: 13, fontWeight: 700, flexShrink: 0,
            }}>
              {count}
            </div>
          )}
          <Icon name="chevron" size={17} style={{
            color: "var(--text-muted)", flexShrink: 0,
            transform: expanded ? "rotate(90deg)" : "none",
            transition: "transform 0.18s cubic-bezier(0.4,0,0.2,1)",
          }} />
        </button>
      </div>

      <div style={{
        maxHeight: expanded ? 260 : 0,
        opacity: expanded ? 1 : 0,
        transition: "max-height 0.24s cubic-bezier(0.4,0,0.2,1), opacity 0.18s ease",
        overflow: "hidden",
      }}>
        <div style={{ padding: "0 18px 16px", borderTop: "1px solid var(--border)", paddingTop: 14 }}>
          <QuickAdd
            autoFocus={expanded}
            placeholder="Add a task"
            onAdd={onQuickAdd}
          />
          <button onClick={onOpenFull} style={{
            display: "flex", alignItems: "center", gap: 4, background: "none", border: "none",
            color: "var(--text-secondary)", fontSize: 13, fontWeight: 500, cursor: "pointer",
            padding: "10px 2px 2px", width: "100%",
          }}>
            View all in {cls.name}
            <Icon name="chevron" size={13} />
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------- class detail screen ---------- */

function ClassScreen({ cls, tasks, onBack, onAdd, onToggle, onDelete, onRename, onColorChange, onDeleteClass }) {
  const [showAdd, setShowAdd] = useState(false);
  const [showCompleted, setShowCompleted] = useState(false);
  const [editing, setEditing] = useState(false);
  const [nameDraft, setNameDraft] = useState(cls.name);
  const [showManage, setShowManage] = useState(false);
  const [confirmingDelete, setConfirmingDelete] = useState(false);

  const active = tasks.filter(t => !t.done);
  const completed = tasks.filter(t => t.done);

  return (
    <div style={{ maxWidth: 640, margin: "0 auto", padding: "0 20px 100px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "18px 0 8px" }}>
        <button onClick={onBack} style={{
          display: "flex", alignItems: "center", gap: 4, background: "none", border: "none",
          color: "var(--text-secondary)", fontSize: 15, cursor: "pointer", padding: "6px 4px 6px 0",
        }}>
          <Icon name="arrowLeft" size={18} />
          Classes
        </button>
        <button onClick={() => { setShowManage(s => !s); setConfirmingDelete(false); }} style={{
          background: "none", border: "none", color: "var(--text-muted)", cursor: "pointer", padding: 6, display: "flex",
        }} aria-label="Class options">
          <Icon name="settings" size={19} />
        </button>
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "6px 0 20px" }}>
        <div style={{ width: 12, height: 12, borderRadius: "50%", background: cls.color, flexShrink: 0 }} />
        {editing ? (
          <input
            autoFocus
            value={nameDraft}
            onChange={e => setNameDraft(e.target.value)}
            onBlur={() => { onRename(nameDraft.trim() || cls.name); setEditing(false); }}
            onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
            style={{
              fontSize: 26, fontWeight: 700, letterSpacing: "-0.02em",
              border: "none", outline: "none", background: "transparent",
              color: "var(--text-primary)", fontFamily: "inherit", width: "100%",
              borderBottom: "2px solid var(--border-strong)", paddingBottom: 2,
            }}
          />
        ) : (
          <h1 style={{ fontSize: 26, fontWeight: 700, letterSpacing: "-0.02em", margin: 0 }}>{cls.name}</h1>
        )}
      </div>

      {showManage && (
        <div style={{
          background: "var(--surface)", border: "1px solid var(--border)",
          borderRadius: "var(--radius-card)", padding: 16, marginBottom: 20,
          boxShadow: "var(--shadow)",
        }}>
          <div style={{ fontSize: 12.5, fontWeight: 600, color: "var(--text-secondary)", textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 10 }}>
            Accent color
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
            {PALETTE.map(c => (
              <button key={c} onClick={() => onColorChange(c)} style={{
                width: 28, height: 28, borderRadius: "50%", background: c, border: cls.color === c ? "2.5px solid var(--text-primary)" : "2.5px solid transparent",
                cursor: "pointer", padding: 0,
              }} aria-label={`Set color ${c}`} />
            ))}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => { setEditing(true); setShowManage(false); }} style={{
              flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
              padding: "9px 12px", borderRadius: "var(--radius-control)", border: "1px solid var(--border-strong)",
              background: "var(--bg)", color: "var(--text-primary)", fontSize: 13.5, cursor: "pointer", fontWeight: 500,
            }}>
              <Icon name="edit" size={14} /> Rename
            </button>
            {!confirmingDelete ? (
              <button onClick={() => setConfirmingDelete(true)} style={{
                flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                padding: "9px 12px", borderRadius: "var(--radius-control)", border: "1px solid var(--border-strong)",
                background: "var(--bg)", color: "#C15B5B", fontSize: 13.5, cursor: "pointer", fontWeight: 500,
              }}>
                <Icon name="trash" size={14} /> Delete class
              </button>
            ) : (
              <button onClick={onDeleteClass} style={{
                flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                padding: "9px 12px", borderRadius: "var(--radius-control)", border: "1px solid #C15B5B",
                background: "#C15B5B", color: "#fff", fontSize: 13.5, cursor: "pointer", fontWeight: 600,
              }}>
                <Icon name="trash" size={14} /> Tap again to confirm
              </button>
            )}
          </div>
        </div>
      )}

      {showAdd ? (
        <div style={{ marginBottom: 18 }}>
          <QuickAdd
            autoFocus
            onAdd={(title) => { onAdd(title); }}
            onCancel={() => setShowAdd(false)}
          />
        </div>
      ) : (
        <button onClick={() => setShowAdd(true)} style={{
          display: "flex", alignItems: "center", gap: 8, width: "100%",
          padding: "12px 14px", marginBottom: 18,
          background: "var(--surface)", border: "1.5px dashed var(--border-strong)",
          borderRadius: "var(--radius-control)", color: "var(--text-secondary)",
          fontSize: 14.5, fontWeight: 500, cursor: "pointer",
        }}>
          <Icon name="plus" size={17} /> Add task
        </button>
      )}

      {active.length === 0 && completed.length === 0 && (
        <div style={{ textAlign: "center", padding: "48px 20px", color: "var(--text-muted)" }}>
          <div style={{ fontSize: 15 }}>Nothing here yet. Add what's due.</div>
        </div>
      )}

      {active.length === 0 && completed.length > 0 && (
        <div style={{ textAlign: "center", padding: "28px 20px", color: "var(--text-muted)", fontSize: 14.5 }}>
          All caught up in {cls.name}.
        </div>
      )}

      {active.length > 0 && (
        <div>
          {active.map(t => (
            <TaskRow key={t.id} task={t} color={cls.color} onToggle={onToggle} onDelete={onDelete} />
          ))}
        </div>
      )}

      {completed.length > 0 && (
        <div style={{ marginTop: 24 }}>
          <button onClick={() => setShowCompleted(s => !s)} style={{
            background: "none", border: "none", color: "var(--text-muted)", fontSize: 13, fontWeight: 500,
            cursor: "pointer", padding: "4px 0", display: "flex", alignItems: "center", gap: 4,
          }}>
            <Icon name="chevron" size={12} style={{ transform: showCompleted ? "rotate(90deg)" : "none", transition: "transform 0.15s ease" }} />
            Completed ({completed.length})
          </button>
          {showCompleted && (
            <div style={{ marginTop: 6, opacity: 0.75 }}>
              {completed.map(t => (
                <TaskRow key={t.id} task={t} color={cls.color} onToggle={onToggle} onDelete={onDelete} />
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ---------- dashboard screen ---------- */

function Dashboard({ classes, tasks, onOpenClass, onAddClass, onAddTask, onReorder }) {
  const [adding, setAdding] = useState(false);
  const [expandedId, setExpandedId] = useState(null);
  const [dragId, setDragId] = useState(null);
  const [dropIndex, setDropIndex] = useState(null);
  const dragOverIdRef = useRef(null);

  const classTasks = useMemo(() => {
    const m = {};
    classes.forEach(c => { m[c.id] = tasks.filter(t => t.classId === c.id && !t.done); });
    return m;
  }, [classes, tasks]);

  const handleDragStart = (id) => (e) => {
    setDragId(id);
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", id); } catch (err) {}
  };

  const handleDragOver = (id, index) => (e) => {
    e.preventDefault();
    dragOverIdRef.current = id;
    setDropIndex(index);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    if (dragId && dragOverIdRef.current && dragId !== dragOverIdRef.current) {
      onReorder(dragId, dragOverIdRef.current);
    }
    setDragId(null);
    setDropIndex(null);
    dragOverIdRef.current = null;
  };

  const handleDragEnd = () => {
    setDragId(null);
    setDropIndex(null);
    dragOverIdRef.current = null;
  };

  return (
    <div style={{ maxWidth: 640, margin: "0 auto", padding: "0 20px 100px" }}>
      <div style={{ padding: "28px 0 22px" }}>
        <h1 style={{ fontSize: 28, fontWeight: 700, letterSpacing: "-0.02em", margin: 0 }}>My classes</h1>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }} onDrop={handleDrop} onDragOver={e => e.preventDefault()}>
        {classes.map((cls, i) => (
          <div
            key={cls.id}
            draggable
            onDragStart={handleDragStart(cls.id)}
            onDragOver={handleDragOver(cls.id, i)}
            onDragEnd={handleDragEnd}
          >
            <ClassCard
              cls={cls}
              activeTasks={classTasks[cls.id] || []}
              expanded={expandedId === cls.id}
              onToggleExpand={() => setExpandedId(id => id === cls.id ? null : cls.id)}
              onOpenFull={() => onOpenClass(cls.id)}
              onQuickAdd={(title) => onAddTask(cls.id, title)}
              dragHandleProps={{ draggable: true, onDragStart: handleDragStart(cls.id) }}
              isDragging={dragId === cls.id}
              isDropTarget={dropIndex === i && dragId && dragId !== cls.id}
            />
          </div>
        ))}
      </div>

      <div style={{ marginTop: 14 }}>
        {adding ? (
          <QuickAdd
            autoFocus
            placeholder="Class name"
            onAdd={(name) => { onAddClass(name); setAdding(false); }}
            onCancel={() => setAdding(false)}
          />
        ) : (
          <button onClick={() => setAdding(true)} style={{
            display: "flex", alignItems: "center", gap: 8, width: "100%",
            padding: "13px 14px",
            background: "transparent", border: "1.5px dashed var(--border-strong)",
            borderRadius: "var(--radius-card)", color: "var(--text-secondary)",
            fontSize: 14.5, fontWeight: 500, cursor: "pointer",
          }}>
            <Icon name="plus" size={17} /> Add class
          </button>
        )}
      </div>
    </div>
  );
}

/* ---------- all tasks screen ---------- */

function AllTasksScreen({ classes, tasks, onToggle, onDelete, onOpenClass }) {
  const byClass = useMemo(() => {
    return classes
      .map(c => ({ cls: c, items: tasks.filter(t => t.classId === c.id && !t.done) }))
      .filter(g => g.items.length > 0);
  }, [classes, tasks]);

  const total = byClass.reduce((n, g) => n + g.items.length, 0);

  return (
    <div style={{ maxWidth: 640, margin: "0 auto", padding: "0 20px 100px" }}>
      <div style={{ padding: "28px 0 22px" }}>
        <h1 style={{ fontSize: 28, fontWeight: 700, letterSpacing: "-0.02em", margin: 0 }}>All tasks</h1>
      </div>

      {total === 0 && (
        <div style={{ textAlign: "center", padding: "48px 20px", color: "var(--text-muted)", fontSize: 15 }}>
          Nothing due anywhere. Enjoy it.
        </div>
      )}

      {byClass.map(({ cls, items }) => (
        <div key={cls.id} style={{ marginBottom: 22 }}>
          <button onClick={() => onOpenClass(cls.id)} style={{
            display: "flex", alignItems: "center", gap: 8, background: "none", border: "none",
            cursor: "pointer", padding: "0 0 8px", color: "var(--text-primary)",
          }}>
            <div style={{ width: 8, height: 8, borderRadius: "50%", background: cls.color }} />
            <span style={{ fontSize: 14.5, fontWeight: 600 }}>{cls.name}</span>
            <span style={{ fontSize: 13, color: "var(--text-muted)" }}>{items.length}</span>
          </button>
          <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--radius-card)", padding: "2px 14px", boxShadow: "var(--shadow)" }}>
            {items.map(t => (
              <TaskRow key={t.id} task={t} color={cls.color} onToggle={onToggle} onDelete={onDelete} />
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ---------- settings screen ---------- */

  const totalTasks = tasks.length;
  const totalDone = tasks.filter(t => t.done).length;

  return (
    <div style={{ maxWidth: 640, margin: "0 auto", padding: "0 20px 100px" }}>
      <div style={{ padding: "28px 0 22px" }}>
        <h1 style={{ fontSize: 28, fontWeight: 700, letterSpacing: "-0.02em", margin: 0 }}>Settings</h1>
      </div>

      <div style={{ marginBottom: 24 }}>
        <div style={{ fontSize: 12.5, fontWeight: 600, color: "var(--text-secondary)", textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 10 }}>
          Appearance
        </div>
        <div style={{ display: "flex", gap: 8, background: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--radius-control)", padding: 4 }}>
          {[["light", "sun", "Light"], ["dark", "moon", "Dark"], ["system", "monitor", "System"]].map(([key, icon, label]) => (
            <button key={key} onClick={() => onThemeChange(key)} style={{
              flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 5,
              padding: "10px 6px", borderRadius: 9, border: "none", cursor: "pointer",
              background: theme === key ? "var(--bg)" : "transparent",
              color: theme === key ? "var(--text-primary)" : "var(--text-secondary)",
              fontWeight: theme === key ? 600 : 500, fontSize: 12.5,
              boxShadow: theme === key ? "var(--shadow)" : "none",
              transition: "all 0.15s ease",
            }}>
              <Icon name={icon} size={17} />
              {label}
            </button>
          ))}
        </div>
      </div>

      <div style={{ marginBottom: 24 }}>
        <div style={{ fontSize: 12.5, fontWeight: 600, color: "var(--text-secondary)", textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 10 }}>
          Data
        </div>
        <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--radius-card)", padding: "4px 16px", boxShadow: "var(--shadow)" }}>
          <div style={{ display: "flex", justifyContent: "space-between", padding: "13px 0", borderBottom: "1px solid var(--border)", fontSize: 14.5 }}>
            <span style={{ color: "var(--text-secondary)" }}>Classes</span>
            <span style={{ fontWeight: 600 }}>{classes.length}</span>
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", padding: "13px 0", borderBottom: "1px solid var(--border)", fontSize: 14.5 }}>
            <span style={{ color: "var(--text-secondary)" }}>Tasks completed</span>
            <span style={{ fontWeight: 600 }}>{totalDone} / {totalTasks}</span>
          </div>
          <button onClick={onExport} style={{
            display: "flex", alignItems: "center", gap: 8, width: "100%", background: "none", border: "none",
            padding: "13px 0", fontSize: 14.5, color: "var(--text-primary)", cursor: "pointer", textAlign: "left",
          }}>
            <Icon name="download" size={16} style={{ color: "var(--text-secondary)" }} />
            Export data
          </button>
        </div>
      </div>

      <div style={{ fontSize: 12.5, color: "var(--text-muted)", textAlign: "center", padding: "20px 0" }}>
        Saved automatically on this device.
      </div>
    </div>
  );
}

/* ---------- bottom nav ---------- */

    { key: "classes", label: "Classes", icon: "grid" },
    { key: "all", label: "All tasks", icon: "list" },
    { key: "settings", label: "Settings", icon: "settings" },

  return (
    <div style={{
      position: "sticky", bottom: 0, left: 0, right: 0,
      display: "flex", justifyContent: "center",
      padding: "0 20px 20px", pointerEvents: "none",
    }}>
      <div style={{
        display: "flex", gap: 2,
        background: "var(--surface-raised)",
        border: "1px solid var(--border)",
        borderRadius: 20,
        padding: 6,
        boxShadow: "var(--shadow-lift)",
        pointerEvents: "auto",
        backdropFilter: "blur(20px)",
      }}>
        {items.map(item => (
          <button key={item.key} onClick={() => setTab(item.key)} style={{

}

/* ---------- floating quick-add ---------- */

function FloatingAdd({ classes, activeClassId, onAdd }) {
  const [open, setOpen] = useState(false);
  const [title, setTitle] = useState("");
  const [classId, setClassId] = useState(activeClassId || (classes[0] && classes[0].id));
  const inputRef = useRef(null);

  useEffect(() => {
    setClassId(activeClassId || (classes[0] && classes[0].id));
  }, [activeClassId, classes]);

  useEffect(() => {
    if (open && inputRef.current) setTimeout(() => inputRef.current.focus(), 60);
  }, [open]);

  const submit = () => {
    const trimmed = title.trim();
    if (trimmed && classId) {
      onAdd(classId, trimmed);
      setTitle("");
      setOpen(false);
    }
  };

  if (classes.length === 0) return null;

  return (
    <>
      {open && (
        <div
          onClick={() => setOpen(false)}
          style={{
            position: "fixed", inset: 0, background: "rgba(0,0,0,0.28)",
            zIndex: 40, backdropFilter: "blur(2px)",
            animation: "fadeIn 0.15s ease",
          }}
        />
      )}
      {open && (
        <div style={{
          position: "fixed", left: "50%", bottom: "max(100px, 12vh)",
          transform: "translateX(-50%)", width: "min(420px, calc(100vw - 40px))",
          background: "var(--surface-raised)", borderRadius: 20,
          border: "1px solid var(--border)", boxShadow: "var(--shadow-lift)",
          padding: 18, zIndex: 41,
          animation: "riseIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1)",
        }}>
          <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 12, color: "var(--text-primary)" }}>
            What do you need to do?
          </div>
          <input
            ref={inputRef}
            value={title}
            onChange={e => setTitle(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") submit(); if (e.key === "Escape") setOpen(false); }}
            placeholder="Finish lab questions"
            style={{
              width: "100%", border: "1.5px solid var(--border-strong)", borderRadius: "var(--radius-control)",
              padding: "11px 13px", fontSize: 15, outline: "none", background: "var(--bg)",
              color: "var(--text-primary)", fontFamily: "inherit", marginBottom: 12,
            }}
          />
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <select
              value={classId}
              onChange={e => setClassId(e.target.value)}
              style={{
                flex: 1, border: "1.5px solid var(--border-strong)", borderRadius: "var(--radius-control)",
                padding: "9px 10px", fontSize: 13.5, background: "var(--bg)", color: "var(--text-primary)",
                fontFamily: "inherit", outline: "none",
              }}
            >
              {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <button onClick={submit} disabled={!title.trim()} style={{
              padding: "9px 18px", borderRadius: "var(--radius-control)", border: "none",
              background: title.trim() ? "var(--text-primary)" : "var(--border)",
              color: title.trim() ? "var(--bg)" : "var(--text-muted)",
              fontSize: 13.5, fontWeight: 600, cursor: title.trim() ? "pointer" : "default",
              transition: "all 0.15s ease",
            }}>
              Add
            </button>
          </div>
        </div>
      )}
      <button
        onClick={() => setOpen(o => !o)}
        aria-label="Add task"
        style={{
          position: "fixed", right: 24, bottom: "max(96px, 11vh)",
          width: 54, height: 54, borderRadius: "50%",
          background: "var(--text-primary)", color: "var(--bg)",
          border: "none", boxShadow: "var(--shadow-lift)",
          display: "flex", alignItems: "center", justifyContent: "center",
          cursor: "pointer", zIndex: 42,
          transform: open ? "rotate(45deg)" : "rotate(0deg)",
          transition: "transform 0.2s cubic-bezier(0.4,0,0.2,1)",
        }}
      >
        <Icon name="plus" size={24} />
      </button>
      <style>{`
        @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
        @keyframes riseIn { from { opacity: 0; transform: translateX(-50%) translateY(12px) scale(0.96); } to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } }
      `}</style>
    </>
  );
}

/* ---------- root app ---------- */

function App() {
  const initial = useRef(loadState()).current;
  const [classes, setClasses] = useState(initial.classes);
  const [tasks, setTasks] = useState(initial.tasks);
  const [theme, setTheme] = useState(initial.theme || "system");
  const [tab, setTab] = useState("classes");
  const [openClassId, setOpenClassId] = useState(null);

  useEffect(() => {
    saveState({ classes, tasks, theme });
  }, [classes, tasks, theme]);

  useEffect(() => {
    const root = document.documentElement;
    const apply = () => {
      let mode = theme;
      if (theme === "system") {
        mode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      root.setAttribute("data-theme", mode);
    };
    apply();
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (theme === "system") {
      mq.addEventListener("change", apply);
      return () => mq.removeEventListener("change", apply);
    }
  }, [theme]);

  const addTask = useCallback((classId, title) => {
    setTasks(t => [...t, { id: uid(), classId, title, done: false, createdAt: Date.now() }]);
  }, []);

  const toggleTask = useCallback((taskId) => {
    setTasks(t => t.map(task => task.id === taskId ? { ...task, done: !task.done } : task));
  }, []);

  const deleteTask = useCallback((taskId) => {
    setTasks(t => t.filter(task => task.id !== taskId));
  }, []);

  const addClass = useCallback((name) => {
    const color = PALETTE[classes.length % PALETTE.length];
    setClasses(c => [...c, { id: uid(), name, color }]);
  }, [classes.length]);

  const renameClass = useCallback((id, name) => {
    setClasses(c => c.map(cls => cls.id === id ? { ...cls, name } : cls));
  }, []);

  const recolorClass = useCallback((id, color) => {
    setClasses(c => c.map(cls => cls.id === id ? { ...cls, color } : cls));
  }, []);

  const reorderClasses = useCallback((draggedId, targetId) => {
    setClasses(c => {
      const list = [...c];
      const fromIdx = list.findIndex(cls => cls.id === draggedId);
      const toIdx = list.findIndex(cls => cls.id === targetId);
      if (fromIdx === -1 || toIdx === -1) return c;
      const [moved] = list.splice(fromIdx, 1);
      list.splice(toIdx, 0, moved);
      return list;
    });
  }, []);

  const deleteClass = useCallback((id) => {
    setClasses(c => c.filter(cls => cls.id !== id));
    setTasks(t => t.filter(task => task.classId !== id));
    setOpenClassId(null);
    setTab("classes");
  }, []);

  const exportData = useCallback(() => {
    const data = JSON.stringify({ classes, tasks }, null, 2);
    const blob = new Blob([data], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "classes-backup.json";
    a.click();
    URL.revokeObjectURL(url);
  }, [classes, tasks]);

  const openClass = classes.find(c => c.id === openClassId);
  const allActiveCount = tasks.filter(t => !t.done).length;

  let content;
  if (openClass) {
    content = (
      <ClassScreen
        cls={openClass}
        tasks={tasks.filter(t => t.classId === openClass.id)}
        onBack={() => setOpenClassId(null)}
        onAdd={(title) => addTask(openClass.id, title)}
        onToggle={toggleTask}
        onDelete={deleteTask}
        onRename={(name) => renameClass(openClass.id, name)}
        onColorChange={(color) => recolorClass(openClass.id, color)}
        onDeleteClass={() => deleteClass(openClass.id)}
      />
    );
  } else if (tab === "classes") {
    content = <Dashboard classes={classes} tasks={tasks} onOpenClass={setOpenClassId} onAddClass={addClass} onAddTask={addTask} onReorder={reorderClasses} />;
  } else if (tab === "all") {
    content = <AllTasksScreen classes={classes} tasks={tasks} onToggle={toggleTask} onDelete={deleteTask} onOpenClass={setOpenClassId} />;
  } else {
    content = <SettingsScreen theme={theme} onThemeChange={setTheme} classes={classes} tasks={tasks} onExport={exportData} />;
  }

  return (
    <div style={{ minHeight: "100%", display: "flex", flexDirection: "column" }}>
      <div style={{ flex: 1 }}>{content}</div>
      <NavBar tab={openClass ? "classes" : tab} setTab={(t) => { setOpenClassId(null); setTab(t); }} allCount={allActiveCount} />
      <FloatingAdd classes={classes} activeClassId={openClass ? openClass.id : null} onAdd={addTask} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
