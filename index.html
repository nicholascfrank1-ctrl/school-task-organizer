/* ---------- cloud sync (Firebase) ---------- */

const SYNC_CODE_KEY = "classesApp.syncCode";

const SYNC_WORDS = [
  "swift", "amber", "quiet", "coral", "brisk", "ember", "misty", "cedar",
  "azure", "quartz", "ivory", "maple", "onyx", "sable", "willow", "zephyr",
  "tiger", "otter", "falcon", "heron", "lynx", "panda", "raven", "sparrow",
];

function generateSyncCode() {
  const a = SYNC_WORDS[Math.floor(Math.random() * SYNC_WORDS.length)];
  const b = SYNC_WORDS[Math.floor(Math.random() * SYNC_WORDS.length)];
  const n = Math.floor(Math.random() * 90) + 10;
  return `${a}-${b}-${n}`;
}

function isFirebaseReady() {
  return typeof window !== "undefined" && window.__firebaseReady;
}

async function pushToCloud(code, data, stamp) {
  if (!isFirebaseReady()) throw new Error("Sync isn't set up yet.");
  const ref = window.__firestoreDoc(window.__firestoreDb, "syncedData", code);
  await window.__firestoreSetDoc(ref, { ...data, updatedAt: stamp || Date.now() });
}

async function pullFromCloud(code) {
  if (!isFirebaseReady()) throw new Error("Sync isn't set up yet.");
  const ref = window.__firestoreDoc(window.__firestoreDb, "syncedData", code);
  const snap = await window.__firestoreGetDoc(ref);
  if (!snap.exists()) return null;
  return snap.data();
}

// Subscribes to real-time updates for a sync code. Calls onData(data) every time
// the cloud copy changes (from any device), including once immediately with the
// current value. Returns an unsubscribe function.
function subscribeToCloud(code, onData) {
  if (!isFirebaseReady()) return () => {};
  const ref = window.__firestoreDoc(window.__firestoreDb, "syncedData", code);
  return window.__firestoreOnSnapshot(ref, (snap) => {
    if (snap.exists()) onData(snap.data());
  }, () => {});
}

/* ---------- date helpers ---------- */

function todayISO() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return isoFromDate(d);
}
function isoFromDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function tomorrowISO() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  d.setHours(0, 0, 0, 0);
  return isoFromDate(d);
}
function dateFromISO(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function formatDueLabel(iso) {
  if (!iso) return "";
  const today = todayISO();
  const tomorrow = tomorrowISO();
  if (iso === today) return "Today";
  if (iso === tomorrow) return "Tomorrow";
  const d = dateFromISO(iso);
  const now = dateFromISO(today);
  const diffDays = Math.round((d - now) / 86400000);
  if (diffDays < 0) {
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  if (diffDays < 7) {
    return d.toLocaleDateString(undefined, { weekday: "short" });
  }
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function isOverdue(iso) {
  if (!iso) return false;
  return iso < todayISO();
}

/* ---------- streak calculation ---------- */

function computeStreak(tasks) {
  // A day "passes" if every task due that day was completed on or before that day.
  // A day with nothing due also passes (there was nothing to miss).
  const dayPasses = (iso) => {
    const dueThatDay = tasks.filter(t => t.dueDate === iso);
    if (dueThatDay.length === 0) return true;
    return dueThatDay.every(t => {
      if (!t.done || !t.completedAt) return false;
      const completedIso = isoFromDate(new Date(t.completedAt));
      return completedIso <= iso;
    });
  };

  // Earliest date any task was ever due or completed — we never count a
  // streak further back than this, so an empty history doesn't look infinite.
  const allDates = [];
  tasks.forEach(t => {
    if (t.dueDate) allDates.push(t.dueDate);
    if (t.completedAt) allDates.push(isoFromDate(new Date(t.completedAt)));
  });
  if (allDates.length === 0) return 0;
  const earliestDate = allDates.reduce((min, d) => (d < min ? d : min));

  const today = todayISO();
  const yesterdayDate = new Date();
  yesterdayDate.setDate(yesterdayDate.getDate() - 1);
  const yesterday = isoFromDate(yesterdayDate);

  // Today doesn't have to be finished yet to keep the streak alive — it just
  // can't already have missed, still-incomplete tasks due today. We start
  // counting from today if today currently passes, otherwise from yesterday,
  // so an in-progress day doesn't break a streak prematurely.
  const startDay = dayPasses(today) ? today : yesterday;

  // If neither today nor yesterday passes, the streak is broken.
  if (!dayPasses(startDay)) return 0;

  let streak = 0;
  let cursor = dateFromISO(startDay);
  while (true) {
    const iso = isoFromDate(cursor);
    if (iso < earliestDate) break;
    if (!dayPasses(iso)) break;
    streak += 1;
    cursor.setDate(cursor.getDate() - 1);
    if (streak > 3650) break; // sanity cap
  }
  return streak;
}

/* ---------- responsive helper ---------- */

function useIsMobile(breakpoint) {
  const bp = breakpoint || 640;
  const [isMobile, setIsMobile] = useState(() => typeof window !== "undefined" && window.innerWidth < bp);
  useEffect(() => {
    const handler = () => setIsMobile(window.innerWidth < bp);
    window.addEventListener("resize", handler);
    return () => window.removeEventListener("resize", handler);
  }, [bp]);
  return isMobile;
}

/* ---------- reusable mini calendar popover for picking a date ---------- */

function MiniCalendarPopover({ value, onSelect, onClose, anchorRect }) {
  const initial = value ? dateFromISO(value) : new Date();
  const [cursor, setCursor] = useState({ year: initial.getFullYear(), month: initial.getMonth() });
  const popRef = useRef(null);

  useEffect(() => {
    const handleClick = (e) => {
      if (popRef.current && !popRef.current.contains(e.target)) onClose();
    };
    document.addEventListener("mousedown", handleClick);
    document.addEventListener("touchstart", handleClick, { passive: true });
    return () => {
      document.removeEventListener("mousedown", handleClick);
      document.removeEventListener("touchstart", handleClick);
    };
  }, [onClose]);

  const { year, month } = cursor;
  const monthLabel = new Date(year, month, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = todayISO();

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const goMonth = (delta) => {
    let m = month + delta, y = year;
    if (m < 0) { m = 11; y -= 1; }
    if (m > 11) { m = 0; y += 1; }
    setCursor({ year: y, month: m });
  };

  const weekdayLabels = ["S", "M", "T", "W", "T", "F", "S"];

  const POP_WIDTH = 240;
  const POP_HEIGHT_EST = 300;
  let top = anchorRect ? anchorRect.bottom + 6 : 0;
  let left = anchorRect ? anchorRect.right - POP_WIDTH : 0;
  if (typeof window !== "undefined") {
    left = Math.max(8, Math.min(left, window.innerWidth - POP_WIDTH - 8));
    if (anchorRect && top + POP_HEIGHT_EST > window.innerHeight) {
      top = Math.max(8, anchorRect.top - POP_HEIGHT_EST - 6);
    }
  }

  const content = (
    <div
      ref={popRef}
      style={{
        position: "fixed", top, left, zIndex: 9999,
        background: "var(--surface-raised)", border: "1px solid var(--border)",
        borderRadius: 14, boxShadow: "var(--shadow-lift)", padding: 12,
        width: POP_WIDTH,
        animation: "popIn 0.15s cubic-bezier(0.34, 1.56, 0.64, 1)",
      }}
    >
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
        <button type="button" onClick={() => goMonth(-1)} style={{
          background: "none", border: "none", cursor: "pointer", color: "var(--text-secondary)",
          padding: 4, display: "flex", borderRadius: 6,
        }}>
          <Icon name="chevron" size={14} style={{ transform: "rotate(180deg)" }} />
        </button>
        <div style={{ fontSize: 12.5, fontWeight: 600 }}>{monthLabel}</div>
        <button type="button" onClick={() => goMonth(1)} style={{
          background: "none", border: "none", cursor: "pointer", color: "var(--text-secondary)",
          padding: 4, display: "flex", borderRadius: 6,
        }}>
          <Icon name="chevron" size={14} />
        </button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2, marginBottom: 2 }}>
        {weekdayLabels.map((w, i) => (
          <div key={i} style={{ textAlign: "center", fontSize: 9.5, fontWeight: 600, color: "var(--text-muted)", padding: "2px 0" }}>{w}</div>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2 }}>
        {cells.map((d, i) => {
          if (d === null) return <div key={i} />;
          const iso = isoFromDate(new Date(year, month, d));
          const isToday = iso === today;
          const isSelected = iso === value;
          return (
            <button
              type="button"
              key={i}
              onClick={() => { onSelect(iso); onClose(); }}
              style={{
                aspectRatio: "1", display: "flex", alignItems: "center", justifyContent: "center",
                borderRadius: 7, border: "none", cursor: "pointer", fontSize: 11.5,
                background: isSelected ? "var(--text-primary)" : (isToday ? "var(--bg)" : "transparent"),
                color: isSelected ? "var(--bg)" : "var(--text-primary)",
                fontWeight: isToday || isSelected ? 700 : 500,
              }}
            >
              {d}
            </button>
          );
        })}
      </div>
    </div>
  );

  return ReactDOM.createPortal(content, document.body);
}

const SWIPE_THRESHOLD = 72;

function vibrate(pattern) {
  try {
    if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate(pattern);
  } catch (e) {}
}

function TaskRow({ task, color, onToggle, onDelete }) {
  const [leaving, setLeaving] = useState(false);
  const [height, setHeight] = useState(null);
  const ref = useRef(null);
  const toggling = useRef(false);

  const [dragX, setDragX] = useState(0);
  const [dragging, setDragging] = useState(false);
  const startX = useRef(0);
  const startY = useRef(0);
  const axisLocked = useRef(null); // 'x' | 'y' | null
  const firedHaptic = useRef(false);

  const handleToggle = () => {
    if (!task.done) {
      if (toggling.current) return;
      toggling.current = true;
      setLeaving(true);
      vibrate(12);
      if (ref.current) setHeight(ref.current.offsetHeight);
      setTimeout(() => { onToggle(task.id); toggling.current = false; }, 320);
    } else {
      onToggle(task.id);
    }
  };

  const handleDeleteSwipe = () => {
    vibrate([10, 30, 10]);
    if (ref.current) setHeight(ref.current.offsetHeight);
    setLeaving(true);
    setTimeout(() => onDelete(task.id), 260);
  };

  const onTouchStart = (e) => {
    if (leaving) return;
    startX.current = e.touches[0].clientX;
    startY.current = e.touches[0].clientY;
    axisLocked.current = null;
    firedHaptic.current = false;
    setDragging(true);
  };

  const onTouchMove = (e) => {
    if (!dragging || leaving) return;
    const dx = e.touches[0].clientX - startX.current;
    const dy = e.touches[0].clientY - startY.current;

    if (axisLocked.current === null) {
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
        axisLocked.current = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      }
    }
    if (axisLocked.current === "y") return; // let the page scroll normally
    if (axisLocked.current === "x") {
      // resist a little past the threshold so it doesn't feel infinite
      const resisted = dx > 0
        ? Math.min(dx, SWIPE_THRESHOLD * 1.6)
        : Math.max(dx, -SWIPE_THRESHOLD * 1.6);
      setDragX(resisted);
      const pastThreshold = Math.abs(resisted) >= SWIPE_THRESHOLD;
      if (pastThreshold && !firedHaptic.current) {
        vibrate(8);
        firedHaptic.current = true;
      } else if (!pastThreshold) {
        firedHaptic.current = false;
      }
    }
  };

  const onTouchEnd = () => {
    if (!dragging) return;
    setDragging(false);
    if (axisLocked.current === "x") {
      if (dragX >= SWIPE_THRESHOLD && !task.done) {
        handleToggle();
      } else if (dragX <= -SWIPE_THRESHOLD) {
        handleDeleteSwipe();
      }
    }
    setDragX(0);
    axisLocked.current = null;
  };

  const overdue = !task.done && isOverdue(task.dueDate);
  const dueLabel = formatDueLabel(task.dueDate);

  const swipeProgress = Math.max(-1, Math.min(1, dragX / SWIPE_THRESHOLD));

  return (
    <div style={{ position: "relative", overflow: "hidden" }}>
      {dragX !== 0 && (
        <div style={{
          position: "absolute", inset: 0,
          display: "flex", alignItems: "center",
          justifyContent: swipeProgress > 0 ? "flex-start" : "flex-end",
          padding: "0 18px",
          background: swipeProgress > 0
            ? `rgba(95,174,140,${0.12 + Math.abs(swipeProgress) * 0.18})`
            : `rgba(193,91,91,${0.12 + Math.abs(swipeProgress) * 0.18})`,
          borderRadius: 10,
        }}>
          <Icon
            name={swipeProgress > 0 ? "check" : "trash"}
            size={18}
            style={{
              color: swipeProgress > 0 ? "#5FAE8C" : "#C15B5B",
              opacity: Math.min(1, Math.abs(swipeProgress) * 1.3),
              transform: `scale(${0.7 + Math.min(1, Math.abs(swipeProgress)) * 0.4})`,
              transition: "transform 0.1s ease",
            }}
          />
        </div>
      )}
      <div
        ref={ref}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        onTouchCancel={() => { setDragging(false); setDragX(0); axisLocked.current = null; }}
        style={{
          display: "flex", alignItems: "center", gap: 12,
          padding: "13px 4px",
          borderBottom: "1px solid var(--border)",
          background: "var(--surface)",
          opacity: leaving ? 0 : 1,
          transform: leaving
            ? "translateX(24px) scale(0.98)"
            : `translateX(${dragX}px)`,
          maxHeight: leaving ? 0 : (height ? height + 40 : 80),
          paddingTop: leaving ? 0 : 13,
          paddingBottom: leaving ? 0 : 13,
          overflow: "hidden",
          transition: dragging
            ? "none"
            : "opacity 0.28s ease, transform 0.28s cubic-bezier(0.4,0,0.2,1), max-height 0.32s cubic-bezier(0.4,0,0.2,1) 0.02s, padding 0.32s ease",
          touchAction: "pan-y",
        }}
      >
        <TaskCheckbox checked={task.done} onToggle={handleToggle} color={color} />
        <span style={{
          flex: 1, fontSize: 15.5, lineHeight: 1.4,
          color: task.done ? "var(--text-muted)" : "var(--text-primary)",
          textDecoration: task.done ? "line-through" : "none",
          transition: "color 0.2s ease",
          wordBreak: "break-word",
        }}>
          {task.title}
        </span>
        {dueLabel && !task.done && (
          <span style={{
            fontSize: 12, fontWeight: 600, flexShrink: 0,
            padding: "3px 8px", borderRadius: 8,
            color: overdue ? "#C15B5B" : "var(--text-secondary)",
            background: overdue ? "#C15B5B18" : "var(--bg)",
            border: overdue ? "none" : "1px solid var(--border)",
            whiteSpace: "nowrap",
          }}>
            {dueLabel}
          </span>
        )}
        <button
          onClick={() => onDelete(task.id)}
          aria-label="Delete task"
          style={{
            background: "none", border: "none", cursor: "pointer",
            color: "var(--text-muted)", padding: 6, borderRadius: 8,
            display: "flex", opacity: 0.6, transition: "opacity 0.15s ease",
            flexShrink: 0,
          }}
          onMouseEnter={e => e.currentTarget.style.opacity = 1}
          onMouseLeave={e => e.currentTarget.style.opacity = 0.6}
        >
          <Icon name="x" size={15} />
        </button>
      </div>
    </div>
  );
}

/* ---------- quick add input ---------- */

function QuickAdd({ onAdd, placeholder, autoFocus, onCancel, withDate }) {
  const [value, setValue] = useState("");
  const [dueDate, setDueDate] = useState(withDate ? tomorrowISO() : null);
  const inputRef = useRef(null);

  useEffect(() => {
    if (autoFocus && inputRef.current) inputRef.current.focus();
  }, [autoFocus]);

  const submit = () => {
    const trimmed = value.trim();
    if (trimmed) {
      if (withDate) {
        onAdd(trimmed, dueDate || tomorrowISO());
        setDueDate(tomorrowISO());
      } else {
        onAdd(trimmed);
      }
      setValue("");
      if (inputRef.current) inputRef.current.focus();
    }
  };

  return (
    <div style={{
      display: "flex", alignItems: "center", gap: 8,
      background: "var(--surface)",
      border: "1.5px solid var(--border-strong)",
      borderRadius: "var(--radius-control)",
      padding: "11px 10px 11px 14px",
    }}>
      <input
        ref={inputRef}
        value={value}
        onChange={e => setValue(e.target.value)}
        onKeyDown={e => {
          if (e.key === "Enter") submit();
          if (e.key === "Escape") { setValue(""); onCancel && onCancel(); }
        }}
        placeholder={placeholder || "What do you need to do?"}
        style={{
          flex: 1, border: "none", outline: "none", background: "transparent",
          fontSize: 15.5, color: "var(--text-primary)", fontFamily: "inherit",
          minWidth: 0,
        }}
      />
      {withDate && (
        <DatePickerButton value={dueDate} onChange={setDueDate} />
      )}
      {value.trim() && (
        <button
          onClick={submit}
          style={{
            background: "var(--text-primary)", color: "var(--bg)",
            border: "none", borderRadius: 8, width: 30, height: 30,
            display: "flex", alignItems: "center", justifyContent: "center",
            cursor: "pointer", flexShrink: 0,
          }}
        >
          <Icon name="check" size={15} style={{ strokeWidth: 3 }} />
        </button>
      )}
    </div>
  );
}

/* ---------- color pack picker ---------- */

function findPackForColor(color) {
  for (const pack of COLOR_PACKS) {
    if (pack.colors.includes(color)) return pack.key;
  }
  return COLOR_PACKS[0].key;
}

function isLightColor(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  // perceived brightness
  const brightness = (r * 299 + g * 587 + b * 114) / 1000;
  return brightness > 235;
}

function ColorPackPicker({ selectedColor, onSelect }) {
  const [activePack, setActivePack] = useState(() => findPackForColor(selectedColor));
  const pack = COLOR_PACKS.find(p => p.key === activePack) || COLOR_PACKS[0];

  return (
    <div>
      <div style={{ display: "flex", gap: 4, marginBottom: 12, background: "var(--bg)", borderRadius: 10, padding: 3 }}>
        {COLOR_PACKS.map(p => (
          <button key={p.key} onClick={() => setActivePack(p.key)} style={{
            flex: 1, padding: "7px 6px", borderRadius: 7, border: "none", cursor: "pointer",
            background: activePack === p.key ? "var(--surface)" : "transparent",
            color: activePack === p.key ? "var(--text-primary)" : "var(--text-secondary)",
            fontWeight: activePack === p.key ? 700 : 500, fontSize: 12,
            boxShadow: activePack === p.key ? "var(--shadow)" : "none",
            transition: "all 0.15s ease",
          }}>
            {p.label}
          </button>
        ))}
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        {pack.colors.map(c => {
          const isVeryLight = isLightColor(c);
          return (
            <button key={c} onClick={() => onSelect(c)} style={{
              width: 28, height: 28, borderRadius: "50%", background: c,
              border: selectedColor === c
                ? "2.5px solid var(--text-primary)"
                : (isVeryLight ? "2.5px solid var(--border-strong)" : "2.5px solid transparent"),
              boxShadow: selectedColor === c ? "0 0 0 2px var(--surface)" : "none",
              cursor: "pointer", padding: 0,
            }} aria-label={`Set color ${c}`} />
          );
        })}
      </div>
    </div>
  );
}

function Dashboard({ classes, tasks, onOpenClass, onAddClass, onAddTask, onReorder, onToggleTask }) {
  const [adding, setAdding] = useState(false);
  const [expandedId, setExpandedId] = useState(null);
  const [dragId, setDragId] = useState(null);
  const [dropIndex, setDropIndex] = useState(null);
  const dragOverIdRef = useRef(null);

  const classTasks = useMemo(() => {
    const m = {};
    classes.forEach(c => { m[c.id] = tasks.filter(t => t.classId === c.id && !t.done); });
    return m;
  }, [classes, tasks]);

  const handleDragStart = (id) => (e) => {
    setDragId(id);
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", id); } catch (err) {}
  };

  const handleDragOver = (id, index) => (e) => {
    e.preventDefault();
    dragOverIdRef.current = id;
    setDropIndex(index);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    if (dragId && dragOverIdRef.current && dragId !== dragOverIdRef.current) {
      onReorder(dragId, dragOverIdRef.current);
    }
    setDragId(null);
    setDropIndex(null);
    dragOverIdRef.current = null;
  };

  const handleDragEnd = () => {
    setDragId(null);
    setDropIndex(null);
    dragOverIdRef.current = null;
  };

  const classById = useMemo(() => {
    const m = {};
    classes.forEach(c => { m[c.id] = c; });
    return m;
  }, [classes]);

  const dueTodayTasks = useMemo(() => {
    const today = todayISO();
    return tasks.filter(t => !t.done && t.dueDate === today);
  }, [tasks]);

  const streak = useMemo(() => computeStreak(tasks), [tasks]);

  return (
    <div style={{ maxWidth: 640, margin: "0 auto", padding: "0 20px 100px" }}>
      {dueTodayTasks.length > 0 && (
        <DueTodayBanner tasks={dueTodayTasks} classById={classById} onOpenClass={onOpenClass} onToggle={onToggleTask} />
      )}

      <div style={{ padding: "28px 0 22px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
        <h1 style={{ fontSize: 28, fontWeight: 700, letterSpacing: "-0.02em", margin: 0 }}>My classes</h1>
        {streak >= 2 && (
          <div style={{
            display: "flex", alignItems: "center", gap: 5,
            background: "#D4884F1a", color: "#C67A3F",
            borderRadius: 20, padding: "6px 12px",
            fontSize: 13, fontWeight: 700, flexShrink: 0,
          }}>
            <Icon name="flame" size={14} />
            {streak} day{streak === 1 ? "" : "s"}
          </div>
        )}
      </div>

      {classes.length === 0 && (
        <div style={{ textAlign: "center", padding: "56px 20px", color: "var(--text-muted)" }}>
          <div style={{ fontSize: 15, marginBottom: 4 }}>No classes yet</div>
          <div style={{ fontSize: 13.5 }}>Add your first class, club, or activity below to get started.</div>
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }} onDrop={handleDrop} onDragOver={e => e.preventDefault()}>
        {classes.map((cls, i) => (
          <div
            key={cls.id}
            draggable
            onDragStart={handleDragStart(cls.id)}
            onDragOver={handleDragOver(cls.id, i)}
            onDragEnd={handleDragEnd}
          >
            <ClassCard
              cls={cls}
              activeTasks={classTasks[cls.id] || []}
              expanded={expandedId === cls.id}
              onToggleExpand={() => setExpandedId(id => id === cls.id ? null : cls.id)}
              onOpenFull={() => onOpenClass(cls.id)}
              onQuickAdd={(title, dueDate) => onAddTask(cls.id, title, dueDate)}
              dragHandleProps={{ draggable: true, onDragStart: handleDragStart(cls.id) }}
              isDragging={dragId === cls.id}
              isDropTarget={dropIndex === i && dragId && dragId !== cls.id}
            />
          </div>
        ))}
      </div>

      <div style={{ marginTop: 14 }}>
        <button onClick={() => setAdding(true)} style={{
          display: "flex", alignItems: "center", gap: 8, width: "100%",
          padding: "13px 14px",
          background: "transparent", border: "1.5px dashed var(--border-strong)",
          borderRadius: "var(--radius-card)", color: "var(--text-secondary)",
          fontSize: 14.5, fontWeight: 500, cursor: "pointer",
        }}>
          <Icon name="plus" size={17} /> Add
        </button>
      </div>

      {adding && (
        <AddItemSheet
          onAdd={(name, category) => { onAddClass(name, category); setAdding(false); }}
          onClose={() => setAdding(false)}
        />
      )}
    </div>
  );
}

/* ---------- all tasks screen ---------- */

function AllTasksScreen({ classes, tasks, onToggle, onDelete, onOpenClass }) {
  const [query, setQuery] = useState("");
  const trimmedQuery = query.trim().toLowerCase();
  const isSearching = trimmedQuery.length > 0;

  const classById = useMemo(() => {
    const m = {};
    classes.forEach(c => { m[c.id] = c; });
    return m;
  }, [classes]);

  const searchResults = useMemo(() => {
    if (!isSearching) return [];
    return tasks
      .filter(t => t.title.toLowerCase().includes(trimmedQuery))
      .sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        const ad = a.dueDate || "9999-99-99";
        const bd = b.dueDate || "9999-99-99";
        if (ad !== bd) return ad < bd ? -1 : 1;
        return b.createdAt - a.createdAt;
      });
  }, [tasks, trimmedQuery, isSearching]);

  const byClass = useMemo(() => {
    const groups = classes
      .map(c => {
        const items = tasks
          .filter(t => t.classId === c.id && !t.done)
          .sort((a, b) => {
            const ad = a.dueDate || "9999-99-99";
            const bd = b.dueDate || "9999-99-99";
            if (ad !== bd) return ad < bd ? -1 : 1;
            return a.createdAt - b.createdAt;
          });
        return { cls: c, items };
      })
      .filter(g => g.items.length > 0);

    groups.sort((a, b) => {
      const ad = a.items[0].dueDate || "9999-99-99";
      const bd = b.items[0].dueDate || "9999-99-99";
      if (ad !== bd) return ad < bd ? -1 : 1;
      return 0;
    });

    return groups;
  }, [classes, tasks]);

  const total = byClass.reduce((n, g) => n + g.items.length, 0);

  return (
    <div style={{ maxWidth: 640, margin: "0 auto", padding: "0 20px 100px" }}>
      <div style={{ padding: "28px 0 14px" }}>
        <h1 style={{ fontSize: 28, fontWeight: 700, letterSpacing: "-0.02em", margin: 0 }}>All tasks</h1>
      </div>

      <div style={{
        display: "flex", alignItems: "center", gap: 8, marginBottom: 20,
        background: "var(--surface)", border: "1px solid var(--border)",
        borderRadius: "var(--radius-control)", padding: "10px 13px",
      }}>
        <Icon name="search" size={16} style={{ color: "var(--text-muted)", flexShrink: 0 }} />
        <input
          value={query}
          onChange={e => setQuery(e.target.value)}
          placeholder="Search tasks"
          style={{
            flex: 1, border: "none", outline: "none", background: "transparent",
            fontSize: 14.5, color: "var(--text-primary)", fontFamily: "inherit",
          }}
        />
        {query && (
          <button onClick={() => setQuery("")} aria-label="Clear search" style={{
            background: "none", border: "none", cursor: "pointer", color: "var(--text-muted)",
            display: "flex", padding: 2,
          }}>
            <Icon name="x" size={14} />
          </button>
        )}
      </div>

      {isSearching ? (
        searchResults.length === 0 ? (
          <div style={{ textAlign: "center", padding: "40px 20px", color: "var(--text-muted)", fontSize: 14.5 }}>
            No tasks match "{query.trim()}"
          </div>
        ) : (
          <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--radius-card)", padding: "2px 14px", boxShadow: "var(--shadow)" }}>
            {searchResults.map(t => {
              const cls = classById[t.classId];
              return (
                <div key={t.id}>
                  <button
                    onClick={() => cls && onOpenClass(cls.id)}
                    style={{
                      background: "none", border: "none", padding: "10px 0 0", cursor: cls ? "pointer" : "default",
                      display: "flex", alignItems: "center", gap: 6, color: "var(--text-secondary)", fontSize: 12,
                      fontWeight: 600,
                    }}
                  >
                    {cls && <span style={{ width: 7, height: 7, borderRadius: "50%", background: cls.color }} />}
                    {cls ? cls.name : "Unknown class"}
                  </button>
                  <TaskRow task={t} color={cls ? cls.color : "var(--text-muted)"} onToggle={onToggle} onDelete={onDelete} />
                </div>
              );
            })}
          </div>
        )
      ) : (
        <>
          {total === 0 && (
            <div style={{ textAlign: "center", padding: "48px 20px", color: "var(--text-muted)", fontSize: 15 }}>
              Nothing due anywhere. Enjoy it.
            </div>
          )}

          {byClass.map(({ cls, items }) => (
            <div key={cls.id} style={{ marginBottom: 22 }}>
              <button onClick={() => onOpenClass(cls.id)} style={{
                display: "flex", alignItems: "center", gap: 8, background: "none", border: "none",
                cursor: "pointer", padding: "0 0 8px", color: "var(--text-primary)",
              }}>
                <div style={{ width: 8, height: 8, borderRadius: "50%", background: cls.color }} />
                <span style={{ fontSize: 14.5, fontWeight: 600 }}>{cls.name}</span>
                <span style={{ fontSize: 13, color: "var(--text-muted)" }}>{items.length}</span>
              </button>
              <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--radius-card)", padding: "2px 14px", boxShadow: "var(--shadow)" }}>
                {items.map(t => (
                  <TaskRow key={t.id} task={t} color={cls.color} onToggle={onToggle} onDelete={onDelete} />
                ))}
              </div>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

/* ---------- calendar screen ---------- */

function CalendarScreen({ classes, tasks, onToggle, onDelete, onOpenClass }) {
  const [viewMode, setViewMode] = useState(() => {
    return (typeof window !== "undefined" && window.innerWidth < 640) ? "day" : "month";
  });
  const [cursor, setCursor] = useState(() => {
    const d = new Date();
    return { year: d.getFullYear(), month: d.getMonth() };
  });
  const [selectedDate, setSelectedDate] = useState(todayISO());

  const classById = useMemo(() => {
    const m = {};
    classes.forEach(c => { m[c.id] = c; });
    return m;
  }, [classes]);

  const tasksByDate = useMemo(() => {
    const m = {};
    tasks.filter(t => !t.done && t.dueDate).forEach(t => {
      (m[t.dueDate] = m[t.dueDate] || []).push(t);
    });
    return m;
  }, [tasks]);

  const today = todayISO();
  const weekdayLabels = ["S", "M", "T", "W", "T", "F", "S"];
  const weekdayLabelsFull = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  // ---- navigation across all views, driven off selectedDate ----
  const selectedDateObj = dateFromISO(selectedDate);

  const goDay = (delta) => {
    const d = new Date(selectedDateObj);
    d.setDate(d.getDate() + delta);
    const iso = isoFromDate(d);
    setSelectedDate(iso);
    setCursor({ year: d.getFullYear(), month: d.getMonth() });
  };

  const goWeek = (delta) => {
    const d = new Date(selectedDateObj);
    d.setDate(d.getDate() + delta * 7);
    const iso = isoFromDate(d);
    setSelectedDate(iso);
    setCursor({ year: d.getFullYear(), month: d.getMonth() });
  };

  const goMonth = (delta) => {
    let m = cursor.month + delta;
    let y = cursor.year;
    if (m < 0) { m = 11; y -= 1; }
    if (m > 11) { m = 0; y += 1; }
    setCursor({ year: y, month: m });
  };

  const goToday = () => {
    setSelectedDate(today);
    const d = new Date();
    setCursor({ year: d.getFullYear(), month: d.getMonth() });
  };

  const selectedTasks = (tasksByDate[selectedDate] || []).sort((a, b) => a.createdAt - b.createdAt);

  /* ---------- header label per view ---------- */
  let headerLabel;
  if (viewMode === "day") {
    headerLabel = selectedDateObj.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  } else if (viewMode === "week") {
    const weekStart = new Date(selectedDateObj);
    weekStart.setDate(weekStart.getDate() - weekStart.getDay());
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 6);
    const sameMonth = weekStart.getMonth() === weekEnd.getMonth();
    headerLabel = sameMonth
      ? `${weekStart.toLocaleDateString(undefined, { month: "long" })} ${weekStart.getDate()}\u2013${weekEnd.getDate()}`
      : `${weekStart.toLocaleDateString(undefined, { month: "short", day: "numeric" })} \u2013 ${weekEnd.toLocaleDateString(undefined, { month: "short", day: "numeric" })}`;
  } else {
    headerLabel = new Date(cursor.year, cursor.month, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
  }

  const handlePrev = () => {
    if (viewMode === "day") goDay(-1);
    else if (viewMode === "week") goWeek(-1);
    else goMonth(-1);
  };
  const handleNext = () => {
    if (viewMode === "day") goDay(1);
    else if (viewMode === "week") goWeek(1);
    else goMonth(1);
  };

  return (
    <div style={{ maxWidth: 760, margin: "0 auto", padding: "0 20px 100px" }}>
      <div style={{ padding: "28px 0 16px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
        <h1 style={{ fontSize: 28, fontWeight: 700, letterSpacing: "-0.02em", margin: 0 }}>Calendar</h1>
        <div style={{ display: "flex", gap: 4, background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 11, padding: 3 }}>
          {[["day", "Day"], ["week", "Week"], ["month", "Month"]].map(([key, label]) => (
            <button key={key} onClick={() => setViewMode(key)} style={{
              padding: "6px 13px", borderRadius: 8, border: "none", cursor: "pointer",
              background: viewMode === key ? "var(--text-primary)" : "transparent",
              color: viewMode === key ? "var(--bg)" : "var(--text-secondary)",
              fontSize: 13, fontWeight: 600, transition: "all 0.15s ease",
            }}>
              {label}
            </button>
          ))}
        </div>
      </div>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16, gap: 10 }}>
        <button onClick={handlePrev} aria-label="Previous" style={{
          background: "var(--surface)", border: "1px solid var(--border)", cursor: "pointer", color: "var(--text-secondary)",
          padding: 8, display: "flex", borderRadius: 10, flexShrink: 0,
        }}>
          <Icon name="chevron" size={18} style={{ transform: "rotate(180deg)" }} />
        </button>
        <button onClick={goToday} style={{
          flex: 1, textAlign: "center", fontSize: viewMode === "day" ? 16 : 17, fontWeight: 700,
          background: "none", border: "none", cursor: "pointer", color: "var(--text-primary)",
          padding: "6px 4px", borderRadius: 8, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
        }}>
          {headerLabel}
        </button>
        <button onClick={handleNext} aria-label="Next" style={{
          background: "var(--surface)", border: "1px solid var(--border)", cursor: "pointer", color: "var(--text-secondary)",
          padding: 8, display: "flex", borderRadius: 10, flexShrink: 0,
        }}>
          <Icon name="chevron" size={18} />
        </button>
      </div>

      {viewMode === "month" && (
        <MonthGrid
          year={cursor.year} month={cursor.month} today={today}
          selectedDate={selectedDate} setSelectedDate={setSelectedDate}
          tasksByDate={tasksByDate} classById={classById}
          weekdayLabels={weekdayLabels}
        />
      )}

      {viewMode === "week" && (
        <WeekGrid
          selectedDateObj={selectedDateObj} today={today}
          selectedDate={selectedDate} setSelectedDate={setSelectedDate}
          tasksByDate={tasksByDate} classById={classById}
          weekdayLabelsFull={weekdayLabelsFull}
        />
      )}

      <div style={{ marginTop: viewMode === "day" ? 4 : 22 }}>
        {viewMode !== "day" && (
          <div style={{ fontSize: 14.5, fontWeight: 600, marginBottom: 10, color: "var(--text-primary)" }}>
            {selectedDate === today ? "Today" : dateFromISO(selectedDate).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" })}
          </div>
        )}
        {selectedTasks.length === 0 ? (
          <div style={{ textAlign: "center", padding: "36px 20px", color: "var(--text-muted)", fontSize: 14.5 }}>
            Nothing due this day.
          </div>
        ) : (
          <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--radius-card)", padding: "2px 14px", boxShadow: "var(--shadow)" }}>
            {selectedTasks.map(t => {
              const cls = classById[t.classId];
              return (
                <div key={t.id}>
                  <button
                    onClick={() => cls && onOpenClass(cls.id)}
                    style={{
                      background: "none", border: "none", padding: "10px 0 0", cursor: cls ? "pointer" : "default",
                      display: "flex", alignItems: "center", gap: 6, color: "var(--text-secondary)", fontSize: 12,
                      fontWeight: 600,
                    }}
                  >
                    {cls && <span style={{ width: 7, height: 7, borderRadius: "50%", background: cls.color }} />}
                    {cls ? cls.name : "Unknown class"}
                  </button>
                  <TaskRow task={t} color={cls ? cls.color : "var(--text-muted)"} onToggle={onToggle} onDelete={onDelete} />
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- month view grid ---------- */

function MonthGrid({ year, month, today, selectedDate, setSelectedDate, tasksByDate, classById, weekdayLabels }) {
  const isMobile = useIsMobile(640);
  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  if (isMobile) {
    return (
      <div style={{
        background: "var(--surface)", border: "1px solid var(--border)",
        borderRadius: "var(--radius-card)", padding: "16px 10px", boxShadow: "var(--shadow)",
      }}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2, marginBottom: 4 }}>
          {weekdayLabels.map((w, i) => (
            <div key={i} style={{ textAlign: "center", fontSize: 11, fontWeight: 700, color: "var(--text-muted)", padding: "2px 0" }}>
              {w}
            </div>
          ))}
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2 }}>
          {cells.map((d, i) => {
            if (d === null) return <div key={i} />;
            const iso = isoFromDate(new Date(year, month, d));
            const dayTasks = tasksByDate[iso] || [];
            const isToday = iso === today;
            const isSelected = iso === selectedDate;
            const overdueCount = dayTasks.filter(t => isOverdue(t.dueDate)).length;
            const dotColors = [...new Set(dayTasks.slice(0, 4).map(t => {
              if (isOverdue(t.dueDate)) return "#C15B5B";
              const c = classById[t.classId];
              return c ? c.color : "var(--text-muted)";
            }))].slice(0, 4);
            return (
              <button
                key={i}
                onClick={() => setSelectedDate(iso)}
                style={{
                  aspectRatio: "1", display: "flex", flexDirection: "column",
                  alignItems: "center", justifyContent: "center", gap: 3,
                  borderRadius: 10, border: "none", cursor: "pointer",
                  background: isSelected ? "var(--text-primary)" : (isToday ? "var(--bg)" : "transparent"),
                  transition: "background 0.15s ease",
                }}
              >
                <span style={{
                  fontSize: 13.5, fontWeight: isToday ? 700 : 500,
                  color: isSelected ? "var(--bg)" : (isToday ? "var(--text-primary)" : "var(--text-primary)"),
                }}>
                  {d}
                </span>
                {dotColors.length > 0 && (
                  <div style={{ display: "flex", gap: 2.5, height: 5 }}>
                    {dotColors.map((color, idx) => (
                      <span key={idx} style={{
                        width: 5, height: 5, borderRadius: "50%",
                        background: isSelected ? "var(--bg)" : color,
                        opacity: isSelected ? 0.85 : 1,
                      }} />
                    ))}
                  </div>
                )}
              </button>
            );
          })}
        </div>
      </div>
    );
  }

  return (
    <div style={{
      background: "var(--surface)", border: "1px solid var(--border)",
      borderRadius: "var(--radius-card)", padding: 20, boxShadow: "var(--shadow)",
    }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 6, marginBottom: 6 }}>
        {weekdayLabels.map((w, i) => (
          <div key={i} style={{ textAlign: "center", fontSize: 12.5, fontWeight: 700, color: "var(--text-muted)", padding: "4px 0" }}>
            {w}
          </div>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 6 }}>
        {cells.map((d, i) => {
          if (d === null) return <div key={i} />;
          const iso = isoFromDate(new Date(year, month, d));
          const dayTasks = tasksByDate[iso] || [];
          const isToday = iso === today;
          const isSelected = iso === selectedDate;
          const overdueCount = dayTasks.filter(t => isOverdue(t.dueDate)).length;
          const preview = dayTasks.slice(0, 3);
          const extra = dayTasks.length - preview.length;
          return (
            <button
              key={i}
              onClick={() => setSelectedDate(iso)}
              style={{
                minHeight: 92,
                display: "flex", flexDirection: "column",
                alignItems: "flex-start", justifyContent: "flex-start",
                padding: "6px 6px",
                borderRadius: 12,
                border: isSelected ? "2px solid var(--text-primary)" : "1px solid var(--border)",
                cursor: "pointer",
                background: isSelected ? "var(--bg)" : (isToday ? "var(--bg)" : "var(--surface)"),
                position: "relative",
                transition: "background 0.15s ease, border-color 0.15s ease",
                overflow: "hidden",
              }}
            >
              <span style={{
                fontSize: 13.5, fontWeight: isToday ? 700 : 600,
                color: isToday ? "var(--text-primary)" : "var(--text-secondary)",
                width: 24, height: 24, display: "flex", alignItems: "center", justifyContent: "center",
                borderRadius: "50%",
                background: isToday ? `${overdueCount > 0 ? "#C15B5B" : "var(--text-primary)"}18` : "transparent",
                flexShrink: 0,
              }}>
                {d}
              </span>
              <div style={{ display: "flex", flexDirection: "column", gap: 3, width: "100%", marginTop: 4 }}>
                {preview.map(t => {
                  const c = classById[t.classId];
                  const bubbleColor = isOverdue(t.dueDate) ? "#C15B5B" : (c ? c.color : "var(--text-muted)");
                  return (
                    <div key={t.id} style={{
                      fontSize: 10.5, lineHeight: 1.3, fontWeight: 600,
                      color: bubbleColor,
                      background: `${bubbleColor}1f`,
                      borderRadius: 6,
                      padding: "2.5px 6px",
                      width: "100%",
                      whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
                    }}>
                      {t.title}
                    </div>
                  );
                })}
                {extra > 0 && (
                  <div style={{ fontSize: 11, color: "var(--text-muted)", fontWeight: 600, paddingLeft: 4 }}>+{extra} more</div>
                )}
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- week view grid ---------- */

function WeekGrid({ selectedDateObj, today, selectedDate, setSelectedDate, tasksByDate, classById, weekdayLabelsFull }) {
  const weekStart = new Date(selectedDateObj);
  weekStart.setDate(weekStart.getDate() - weekStart.getDay());

  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    days.push(d);
  }

  return (
    <div style={{
      background: "var(--surface)", border: "1px solid var(--border)",
      borderRadius: "var(--radius-card)", padding: 14, boxShadow: "var(--shadow)",
      display: "flex", flexDirection: "column", gap: 6,
    }}>
      {days.map((d, i) => {
        const iso = isoFromDate(d);
        const dayTasks = (tasksByDate[iso] || []);
        const isToday = iso === today;
        const isSelected = iso === selectedDate;
        const overdueCount = dayTasks.filter(t => isOverdue(t.dueDate)).length;
        return (
          <button
            key={i}
            onClick={() => setSelectedDate(iso)}
            style={{
              display: "flex", alignItems: "flex-start", gap: 12,
              padding: "10px 10px",
              borderRadius: 12,
              border: isSelected ? "2px solid var(--text-primary)" : "1px solid var(--border)",
              cursor: "pointer",
              background: isSelected ? "var(--bg)" : (isToday ? "var(--bg)" : "transparent"),
              textAlign: "left",
              transition: "background 0.15s ease, border-color 0.15s ease",
            }}
          >
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", width: 42, flexShrink: 0 }}>
              <span style={{ fontSize: 11, fontWeight: 700, color: "var(--text-muted)", textTransform: "uppercase" }}>
                {weekdayLabelsFull[d.getDay()]}
              </span>
              <span style={{
                fontSize: 17, fontWeight: isToday ? 700 : 600,
                color: isToday ? "var(--text-primary)" : "var(--text-secondary)",
                width: 30, height: 30, display: "flex", alignItems: "center", justifyContent: "center",
                borderRadius: "50%", marginTop: 2,
                background: isToday ? `${overdueCount > 0 ? "#C15B5B" : "var(--text-primary)"}18` : "transparent",
              }}>
                {d.getDate()}
              </span>
            </div>
            <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 4, minWidth: 0, paddingTop: 2 }}>
              {dayTasks.length === 0 ? (
                <span style={{ fontSize: 13, color: "var(--text-muted)" }}>&mdash;</span>
              ) : (
                <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                  {dayTasks.slice(0, 4).map(t => {
                    const c = classById[t.classId];
                    const bubbleColor = isOverdue(t.dueDate) ? "#C15B5B" : (c ? c.color : "var(--text-muted)");
                    return (
                      <span key={t.id} style={{
                        fontSize: 12, fontWeight: 600, color: bubbleColor,
                        background: `${bubbleColor}1f`, borderRadius: 7,
                        padding: "3px 8px", maxWidth: "100%",
                        whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
                      }}>
                        {t.title}
                      </span>
                    );
                  })}
                </div>
              )}
              {dayTasks.length > 4 && (
                <span style={{ fontSize: 12, color: "var(--text-muted)", fontWeight: 600 }}>+{dayTasks.length - 4} more</span>
              )}
            </div>
          </button>
        );
      })}
    </div>
  );
}

/* ---------- settings screen ---------- */

function SettingsScreen({
  theme, onThemeChange, classes, tasks, onReorder, onExport,
  syncCode, onCreateSync, onEnterSync, onDisconnectSync, syncStatus,
}) {
  const totalTasks = tasks.length;
  const totalDone = tasks.filter(t => t.done).length;
  const [enterMode, setEnterMode] = useState(false);
  const [codeInput, setCodeInput] = useState("");
  const [firebaseReady, setFirebaseReady] = useState(isFirebaseReady());

  useEffect(() => {
    if (firebaseReady) return;
    const handler = () => setFirebaseReady(isFirebaseReady());
    window.addEventListener("firebase-ready", handler);
    return () => window.removeEventListener("firebase-ready", handler);
  }, [firebaseReady]);

  return (
    <div style={{ maxWidth: 640, margin: "0 auto", padding: "0 20px 100px" }}>
      <div style={{ padding: "28px 0 22px" }}>
        <h1 style={{ fontSize: 28, fontWeight: 700, letterSpacing: "-0.02em", margin: 0 }}>Settings</h1>
      </div>

      <div style={{ marginBottom: 24 }}>
        <div style={{ fontSize: 12.5, fontWeight: 600, color: "var(--text-secondary)", textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 10 }}>
          Appearance
        </div>
        <div style={{ display: "flex", gap: 8, background: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--radius-control)", padding: 4 }}>
          {[["light", "sun", "Light"], ["dark", "moon", "Dark"], ["system", "monitor", "System"]].map(([key, icon, label]) => (
            <button key={key} onClick={() => onThemeChange(key)} style={{
              flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 5,
              padding: "10px 6px", borderRadius: 9, border: "none", cursor: "pointer",
              background: theme === key ? "var(--bg)" : "transparent",
              color: theme === key ? "var(--text-primary)" : "var(--text-secondary)",
              fontWeight: theme === key ? 600 : 500, fontSize: 12.5,
              boxShadow: theme === key ? "var(--shadow)" : "none",
              transition: "all 0.15s ease",
            }}>
              <Icon name={icon} size={17} />
              {label}
            </button>
          ))}
        </div>
      </div>

      <div style={{ marginBottom: 24 }}>
        <div style={{ fontSize: 12.5, fontWeight: 600, color: "var(--text-secondary)", textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 10 }}>
          Sync across devices
        </div>
        <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--radius-card)", padding: 16, boxShadow: "var(--shadow)" }}>
          {!firebaseReady ? (
            <div style={{ fontSize: 13.5, color: "var(--text-secondary)", lineHeight: 1.5 }}>
              Sync isn't set up yet for this deployment.
            </div>
          ) : syncCode ? (
            <div>
              <div style={{ fontSize: 12.5, color: "var(--text-secondary)", marginBottom: 6 }}>
                This device is synced with code
              </div>
              <div style={{
                fontSize: 18, fontWeight: 700, letterSpacing: "0.02em",
                fontFamily: "monospace", padding: "10px 12px", background: "var(--bg)",
                borderRadius: 10, marginBottom: 10, textAlign: "center",
              }}>
                {syncCode}
              </div>
              <div style={{ fontSize: 12, color: "var(--text-muted)", marginBottom: 12, lineHeight: 1.4 }}>
                Enter this code on another device's Settings to pull your classes and tasks there too.
                {syncStatus === "saving" && " Syncing…"}
                {syncStatus === "saved" && " Up to date."}
                {syncStatus === "error" && " Couldn't reach the sync server."}
              </div>
              <button onClick={onDisconnectSync} style={{
                width: "100%", padding: "9px 12px", borderRadius: "var(--radius-control)",
                border: "1px solid var(--border-strong)", background: "var(--bg)",
                color: "var(--text-secondary)", fontSize: 13, fontWeight: 500, cursor: "pointer",
              }}>
                Disconnect this device
              </button>
            </div>
          ) : enterMode ? (
            <div>
              <div style={{ fontSize: 12.5, color: "var(--text-secondary)", marginBottom: 8 }}>
                Enter your sync code
              </div>
              <input
                value={codeInput}
                onChange={e => setCodeInput(e.target.value)}
                placeholder="swift-tiger-42"
                style={{
                  width: "100%", border: "1.5px solid var(--border-strong)", borderRadius: "var(--radius-control)",
                  padding: "10px 12px", fontSize: 14, outline: "none", background: "var(--bg)",
                  color: "var(--text-primary)", fontFamily: "monospace", marginBottom: 10,
                }}
              />
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => setEnterMode(false)} style={{
                  flex: 1, padding: "9px 12px", borderRadius: "var(--radius-control)",
                  border: "1px solid var(--border-strong)", background: "var(--bg)",
                  color: "var(--text-secondary)", fontSize: 13, fontWeight: 500, cursor: "pointer",
                }}>
                  Cancel
                </button>
                <button onClick={() => { onEnterSync(codeInput.trim()); setEnterMode(false); }} disabled={!codeInput.trim()} style={{
                  flex: 1, padding: "9px 12px", borderRadius: "var(--radius-control)", border: "none",
                  background: codeInput.trim() ? "var(--text-primary)" : "var(--border)",
                  color: codeInput.trim() ? "var(--bg)" : "var(--text-muted)",
                  fontSize: 13, fontWeight: 600, cursor: codeInput.trim() ? "pointer" : "default",
                }}>
                  Sync this device
                </button>
              </div>
            </div>
          ) : (
            <div>
              <div style={{ fontSize: 13.5, color: "var(--text-secondary)", lineHeight: 1.5, marginBottom: 12 }}>
                Get a code to back up your data and pull it up on another device — like a school Chromebook.
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={onCreateSync} style={{
                  flex: 1, padding: "9px 12px", borderRadius: "var(--radius-control)", border: "none",
                  background: "var(--text-primary)", color: "var(--bg)",
                  fontSize: 13, fontWeight: 600, cursor: "pointer",
                }}>
                  Create a sync code
                </button>
                <button onClick={() => setEnterMode(true)} style={{
                  flex: 1, padding: "9px 12px", borderRadius: "var(--radius-control)",
                  border: "1px solid var(--border-strong)", background: "var(--bg)",
                  color: "var(--text-primary)", fontSize: 13, fontWeight: 500, cursor: "pointer",
                }}>
                  I have a code
                </button>
              </div>
            </div>
          )}
        </div>
      </div>

      <div style={{ marginBottom: 24 }}>
        <div style={{ fontSize: 12.5, fontWeight: 600, color: "var(--text-secondary)", textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 10 }}>
          Data
        </div>
        <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: "var(--radius-card)", padding: "4px 16px", boxShadow: "var(--shadow)" }}>
          <div style={{ display: "flex", justifyContent: "space-between", padding: "13px 0", borderBottom: "1px solid var(--border)", fontSize: 14.5 }}>
            <span style={{ color: "var(--text-secondary)" }}>Classes</span>
            <span style={{ fontWeight: 600 }}>{classes.length}</span>
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", padding: "13px 0", borderBottom: "1px solid var(--border)", fontSize: 14.5 }}>
            <span style={{ color: "var(--text-secondary)" }}>Tasks completed</span>
            <span style={{ fontWeight: 600 }}>{totalDone} / {totalTasks}</span>
          </div>
          <button onClick={onExport} style={{
            display: "flex", alignItems: "center", gap: 8, width: "100%", background: "none", border: "none",
            padding: "13px 0", fontSize: 14.5, color: "var(--text-primary)", cursor: "pointer", textAlign: "left",
          }}>
            <Icon name="download" size={16} style={{ color: "var(--text-secondary)" }} />
            Export data
          </button>
        </div>
      </div>

      <div style={{ fontSize: 12.5, color: "var(--text-muted)", textAlign: "center", padding: "20px 0" }}>
        Saved automatically on this device.
      </div>
    </div>
  );
}

/* ---------- bottom nav ---------- */

  const items = [
    { key: "classes", label: "Classes", icon: "grid" },
    { key: "calendar", label: "Calendar", icon: "calendar" },
    { key: "all", label: "All tasks", icon: "list" },
    { key: "settings", label: "Settings", icon: "settings" },
  ];
  return (
    <div style={{
      position: "sticky", bottom: 0, left: 0, right: 0,
      display: "flex", justifyContent: "center",
      padding: "0 20px calc(20px + env(safe-area-inset-bottom, 0px))", pointerEvents: "none",
    }}>
      <div style={{
        display: "flex", gap: 2,
        background: "var(--surface-raised)",
        border: "1px solid var(--border)",
        borderRadius: 20,
        padding: 6,
        boxShadow: "var(--shadow-lift)",
        pointerEvents: "auto",
        backdropFilter: "blur(20px)",
      }}>
        {items.map(item => (
          <button key={item.key} onClick={() => setTab(item.key)} style={{
            display: "flex", alignItems: "center", gap: 7,
            padding: "10px 16px", borderRadius: 15, border: "none", cursor: "pointer",
            background: tab === item.key ? "var(--text-primary)" : "transparent",
            color: tab === item.key ? "var(--bg)" : "var(--text-secondary)",
            fontSize: 13.5, fontWeight: 600,
            transition: "all 0.18s cubic-bezier(0.4,0,0.2,1)",
            position: "relative",
          }}>
            <Icon name={item.icon} size={17} />
            <span style={{ display: window.innerWidth < 420 ? "none" : "inline" }}>{item.label}</span>
            {item.key === "all" && allCount > 0 && tab !== "all" && (
              <span style={{
                position: "absolute", top: -2, right: -2,
                width: 8, height: 8, borderRadius: "50%",
                background: "#D6714E",
              }} />
            )}
          </button>
        ))}
      </div>
    </div>
  );
}

/* ---------- undo toast ---------- */

function UndoToast({ entry, onUndo, onDismiss }) {
  if (!entry) return null;
  return (
    <div style={{
      position: "fixed", left: "50%", bottom: "max(94px, 10vh)",
      transform: "translateX(-50%)",
      zIndex: 50,
      animation: "riseInCenter 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)",
    }}>
      <div style={{
        display: "flex", alignItems: "center", gap: 12,
        background: "var(--surface-raised)", border: "1px solid var(--border)",
        borderRadius: 14, boxShadow: "var(--shadow-lift)",
        padding: "10px 10px 10px 16px",
        backdropFilter: "blur(20px)",
      }}>
        <span style={{ fontSize: 13.5, color: "var(--text-primary)", fontWeight: 500, whiteSpace: "nowrap" }}>
          {entry.label}
        </span>
        <button onClick={onUndo} style={{
          background: "none", border: "none", cursor: "pointer",
          color: "var(--text-primary)", fontSize: 13.5, fontWeight: 700,
          padding: "6px 10px", borderRadius: 8,
        }}>
          Undo
        </button>
        <button onClick={onDismiss} aria-label="Dismiss" style={{
          background: "none", border: "none", cursor: "pointer",
          color: "var(--text-muted)", padding: 6, borderRadius: 8, display: "flex",
        }}>
          <Icon name="x" size={14} />
        </button>
      </div>
    </div>
  );
}

function FloatingAdd({ classes, activeClassId, onAdd }) {
  const [open, setOpen] = useState(false);
  const [title, setTitle] = useState("");
  const [classId, setClassId] = useState(activeClassId || (classes[0] && classes[0].id));
  const [dueDate, setDueDate] = useState(tomorrowISO());
  const inputRef = useRef(null);

  useEffect(() => {
    setClassId(activeClassId || (classes[0] && classes[0].id));
  }, [activeClassId, classes]);

  useEffect(() => {
    if (open && inputRef.current) setTimeout(() => inputRef.current.focus(), 60);
    if (open) setDueDate(tomorrowISO());
  }, [open]);

  const submit = () => {
    const trimmed = title.trim();
    if (trimmed && classId) {
      onAdd(classId, trimmed, dueDate || tomorrowISO());
      setTitle("");
      setOpen(false);
    }
  };

  if (classes.length === 0) return null;

  return (
    <>
      {open && (
        <div
          onClick={() => setOpen(false)}
          style={{
            position: "fixed", inset: 0, background: "rgba(0,0,0,0.28)",
            zIndex: 40, backdropFilter: "blur(2px)",
            animation: "fadeIn 0.15s ease",
          }}
        />
      )}
      {open && (
        <div style={{
          position: "fixed", left: "50%", bottom: "max(100px, 12vh)",
          transform: "translateX(-50%)", width: "min(420px, calc(100vw - 40px))",
          background: "var(--surface-raised)", borderRadius: 20,
          border: "1px solid var(--border)", boxShadow: "var(--shadow-lift)",
          padding: 18, zIndex: 41,
          animation: "riseInCenter 0.22s cubic-bezier(0.34, 1.56, 0.64, 1)",
        }}>
          <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 12, color: "var(--text-primary)" }}>
            What do you need to do?
          </div>
          <input
            ref={inputRef}
            value={title}
            onChange={e => setTitle(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") submit(); if (e.key === "Escape") setOpen(false); }}
            placeholder="Finish lab questions"
            style={{
              width: "100%", border: "1.5px solid var(--border-strong)", borderRadius: "var(--radius-control)",
              padding: "11px 13px", fontSize: 15, outline: "none", background: "var(--bg)",
              color: "var(--text-primary)", fontFamily: "inherit", marginBottom: 12,
            }}
          />
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
            <select
              value={classId}
              onChange={e => setClassId(e.target.value)}
              style={{
                flex: 1, border: "1.5px solid var(--border-strong)", borderRadius: "var(--radius-control)",
                padding: "9px 10px", fontSize: 13.5, background: "var(--bg)", color: "var(--text-primary)",
                fontFamily: "inherit", outline: "none", minWidth: 0,
              }}
            >
              {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <DatePickerButton value={dueDate} onChange={setDueDate} />
          </div>
          <button onClick={submit} disabled={!title.trim()} style={{
            width: "100%", padding: "10px 18px", borderRadius: "var(--radius-control)", border: "none",
            background: title.trim() ? "var(--text-primary)" : "var(--border)",
            color: title.trim() ? "var(--bg)" : "var(--text-muted)",
            fontSize: 13.5, fontWeight: 600, cursor: title.trim() ? "pointer" : "default",
            transition: "all 0.15s ease",
          }}>
            Add
          </button>
        </div>
      )}
      <button
        onClick={() => setOpen(o => !o)}
        aria-label="Add task"
        style={{
          position: "fixed", right: 24, bottom: "max(96px, 11vh)",
          width: 54, height: 54, borderRadius: "50%",
          background: "var(--text-primary)", color: "var(--bg)",
          border: "none", boxShadow: "var(--shadow-lift)",
          display: "flex", alignItems: "center", justifyContent: "center",
          cursor: "pointer", zIndex: 42,
          transform: open ? "rotate(45deg)" : "rotate(0deg)",
          transition: "transform 0.2s cubic-bezier(0.4,0,0.2,1)",
        }}
      >
        <Icon name="plus" size={24} />
      </button>
    </>
  );
}

/* ---------- root app ---------- */

function App() {
  const initial = useRef(loadState()).current;
  const [classes, setClasses] = useState(initial.classes);
  const [tasks, setTasks] = useState(initial.tasks);
  const [theme, setTheme] = useState(initial.theme || "system");
  const [tab, setTab] = useState("classes");
  const [openClassId, setOpenClassId] = useState(null);
  const [syncCode, setSyncCode] = useState(() => {
    try { return localStorage.getItem(SYNC_CODE_KEY) || null; } catch (e) { return null; }
  });
  const [syncStatus, setSyncStatus] = useState(null);
  const lastPushedAt = useRef(0);
  const suppressNextRemoteApply = useRef(false);
  const [firebaseReadyTick, setFirebaseReadyTick] = useState(isFirebaseReady());

  // Firebase's setup script loads separately and can finish after this app
  // has already mounted — this makes sure sync retries once it's actually ready.
  useEffect(() => {
    if (firebaseReadyTick) return;
    const handler = () => setFirebaseReadyTick(isFirebaseReady());
    window.addEventListener("firebase-ready", handler);
    return () => window.removeEventListener("firebase-ready", handler);
  }, [firebaseReadyTick]);

  useEffect(() => {
    saveState({ classes, tasks, theme });
  }, [classes, tasks, theme]);

  // Push to cloud shortly after data changes, if synced
  useEffect(() => {
    if (!syncCode || !isFirebaseReady()) return;
    if (suppressNextRemoteApply.current) { suppressNextRemoteApply.current = false; return; }
    setSyncStatus("saving");
    const t = setTimeout(() => {
      const stamp = Date.now();
      lastPushedAt.current = stamp;
      pushToCloud(syncCode, { classes, tasks }, stamp)
        .then(() => setSyncStatus("saved"))
        .catch(() => setSyncStatus("error"));
    }, 500);
    return () => clearTimeout(t);
  }, [classes, tasks, syncCode, firebaseReadyTick]);

  // Stay live-connected to the cloud copy while synced, so changes made on
  // another device show up here within about a second — no refresh needed.
  useEffect(() => {
    if (!syncCode || !isFirebaseReady()) return;
    const unsubscribe = subscribeToCloud(syncCode, (data) => {
      // Ignore snapshots that are just an echo of our own most recent push
      if (data.updatedAt && data.updatedAt <= lastPushedAt.current) return;
      suppressNextRemoteApply.current = true;
      setClasses(data.classes || []);
      setTasks(data.tasks || []);
      setSyncStatus("saved");
    });
    return unsubscribe;
  }, [syncCode, firebaseReadyTick]);

  const createSync = useCallback(() => {
    const code = generateSyncCode();
    setSyncCode(code);
    try { localStorage.setItem(SYNC_CODE_KEY, code); } catch (e) {}
    setSyncStatus("saving");
    const stamp = Date.now();
    lastPushedAt.current = stamp;
    pushToCloud(code, { classes, tasks }, stamp)
      .then(() => setSyncStatus("saved"))
      .catch(() => setSyncStatus("error"));
  }, [classes, tasks]);

  const enterSync = useCallback((code) => {
    if (!code) return;
    setSyncStatus("saving");
    pullFromCloud(code)
      .then(data => {
        if (data) {
          suppressNextRemoteApply.current = true;
          lastPushedAt.current = data.updatedAt || Date.now();
          setClasses(data.classes || []);
          setTasks(data.tasks || []);
        }
        setSyncCode(code);
        try { localStorage.setItem(SYNC_CODE_KEY, code); } catch (e) {}
        setSyncStatus("saved");
      })
      .catch(() => setSyncStatus("error"));
  }, []);

  const disconnectSync = useCallback(() => {
    setSyncCode(null);
    setSyncStatus(null);
    try { localStorage.removeItem(SYNC_CODE_KEY); } catch (e) {}
  }, []);

  useEffect(() => {
    const root = document.documentElement;
    const apply = () => {
      let mode = theme;
      if (theme === "system") {
        mode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      root.setAttribute("data-theme", mode);
    };
    apply();
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (theme === "system") {
      mq.addEventListener("change", apply);
      return () => mq.removeEventListener("change", apply);
    }
  }, [theme]);

  const addTask = useCallback((classId, title, dueDate) => {
    setTasks(t => [...t, { id: uid(), classId, title, done: false, dueDate: dueDate || tomorrowISO(), createdAt: Date.now() }]);
  }, []);

  const [undoStack, setUndoStack] = useState([]);
  const undoTimerRef = useRef(null);

  const pushUndo = useCallback((entry) => {
    setUndoStack(s => [...s.slice(-2), entry]); // keep at most 3 queued, oldest drop off
    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
    undoTimerRef.current = setTimeout(() => {
      setUndoStack(s => s.slice(1));
    }, 4500);
  }, []);

  const dismissUndo = useCallback(() => {
    setUndoStack(s => s.slice(1));
    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
  }, []);

  const undoLast = useCallback(() => {
    setUndoStack(s => {
      const entry = s[0];
      if (entry) entry.restore();
      return s.slice(1);
    });
    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
  }, []);

  const toggleTask = useCallback((taskId) => {
    setTasks(t => {
      const task = t.find(x => x.id === taskId);
      const willComplete = task && !task.done;
      if (willComplete) {
        pushUndo({
          label: "Task completed",
          restore: () => setTasks(t2 => t2.map(x => x.id === taskId ? { ...x, done: false, completedAt: null } : x)),
        });
      }
      return t.map(x => x.id === taskId
        ? { ...x, done: !x.done, completedAt: !x.done ? Date.now() : null }
        : x
      );
    });
  }, [pushUndo]);

  const deleteTask = useCallback((taskId) => {
    setTasks(t => {
      const removed = t.find(x => x.id === taskId);
      if (removed) {
        pushUndo({
          label: "Task deleted",
          restore: () => setTasks(t2 => [...t2, removed]),
        });
      }
      return t.filter(x => x.id !== taskId);
    });
  }, [pushUndo]);

  const addClass = useCallback((name, category) => {
    const color = PALETTE[classes.length % PALETTE.length];
    setClasses(c => [...c, { id: uid(), name, color, category: category || "class" }]);
  }, [classes.length]);

  const renameClass = useCallback((id, name) => {
    setClasses(c => c.map(cls => cls.id === id ? { ...cls, name } : cls));
  }, []);

  const recolorClass = useCallback((id, color) => {
    setClasses(c => c.map(cls => cls.id === id ? { ...cls, color } : cls));
  }, []);

  const reorderClasses = useCallback((draggedId, targetId) => {
    setClasses(c => {
      const list = [...c];
      const fromIdx = list.findIndex(cls => cls.id === draggedId);
      const toIdx = list.findIndex(cls => cls.id === targetId);
      if (fromIdx === -1 || toIdx === -1) return c;
      const [moved] = list.splice(fromIdx, 1);
      list.splice(toIdx, 0, moved);
      return list;
    });
  }, []);

  const deleteClass = useCallback((id) => {
    setClasses(c => c.filter(cls => cls.id !== id));
    setTasks(t => t.filter(task => task.classId !== id));
    setOpenClassId(null);
    setTab("classes");
  }, []);

  const exportData = useCallback(() => {
    const data = JSON.stringify({ classes, tasks }, null, 2);
    const blob = new Blob([data], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "classes-backup.json";
    a.click();
    URL.revokeObjectURL(url);
  }, [classes, tasks]);

  const openClass = classes.find(c => c.id === openClassId);
  const allActiveCount = tasks.filter(t => !t.done).length;

  let content;
  if (openClass) {
    content = (
      <ClassScreen
        cls={openClass}
        tasks={tasks.filter(t => t.classId === openClass.id)}
        onBack={() => setOpenClassId(null)}
        onAdd={(title, dueDate) => addTask(openClass.id, title, dueDate)}
        onToggle={toggleTask}
        onDelete={deleteTask}
        onRename={(name) => renameClass(openClass.id, name)}
        onColorChange={(color) => recolorClass(openClass.id, color)}
        onDeleteClass={() => deleteClass(openClass.id)}
      />
    );
  } else if (tab === "classes") {
    content = <Dashboard classes={classes} tasks={tasks} onOpenClass={setOpenClassId} onAddClass={addClass} onAddTask={addTask} onReorder={reorderClasses} onToggleTask={toggleTask} />;
  } else if (tab === "calendar") {
    content = <CalendarScreen classes={classes} tasks={tasks} onToggle={toggleTask} onDelete={deleteTask} onOpenClass={setOpenClassId} />;
  } else if (tab === "all") {
    content = <AllTasksScreen classes={classes} tasks={tasks} onToggle={toggleTask} onDelete={deleteTask} onOpenClass={setOpenClassId} />;
  } else {
    content = (
      <SettingsScreen
        theme={theme} onThemeChange={setTheme} classes={classes} tasks={tasks} onExport={exportData}
        syncCode={syncCode} onCreateSync={createSync} onEnterSync={enterSync} onDisconnectSync={disconnectSync}
        syncStatus={syncStatus}
      />
    );
  }

  return (
    <div id="app-shell" style={{ display: "flex", flexDirection: "column" }}>
      <div style={{ flex: 1 }}>{content}</div>
      <NavBar tab={openClass ? "classes" : tab} setTab={(t) => { setOpenClassId(null); setTab(t); }} allCount={allActiveCount} />
      <FloatingAdd classes={classes} activeClassId={openClass ? openClass.id : null} onAdd={addTask} />
      <UndoToast entry={undoStack[0] || null} onUndo={undoLast} onDismiss={dismissUndo} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
