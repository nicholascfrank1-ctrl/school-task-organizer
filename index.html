          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={{ fontSize: 16, fontWeight: 600 }}>Add a task</div>
            <button aria-label="Close add event" onClick={() => setOpen(false)} style={{ display: "flex", alignItems: "center", justifyContent: "center", border: "none", background: "var(--bg)", color: "var(--text-primary)", borderRadius: "var(--radius-iphone)", padding: 10 }}><Icon name="x" size={18} /></button>
          </div>
          <div className="task-title-row">
          <input
            ref={inputRef}
            value={title}
            onChange={e => setTitle(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") submit(); if (e.key === "Escape") setOpen(false); }}
            aria-label="Event title" enterKeyHint="done"
            placeholder={isEvent ? "Appointment, birthday, or plans" : "Homework, test, or quiz"}
            style={{
              width: "100%", border: "1.5px solid var(--border-strong)", borderRadius: "var(--radius-control)",
              padding: "11px 13px", fontSize: 16, outline: "none", background: "var(--bg)",
              color: "var(--text-primary)", fontFamily: "inherit", marginBottom: 12,
            }}
          />
            <DatePickerButton compact value={dueDate} onChange={setDueDate} />
          </div>
          <TaskAddOptions isEvent={isEvent} onChange={setIsEvent}>
          <div className="sheet-fields" style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
            <RoundedSelect label="Calendar category" value={classId} onChange={setClassId} options={[["", "General event (no class)"], ...classes.map(c => [c.id,c.name])]} style={{flex: 1, minWidth: 0}} />
          </div>
          <EventTimeFields time={time} onTime={setTime} notify={notify} onNotify={setNotify} />
          <RepeatFields repeat={repeat} onRepeat={setRepeat} until={repeatUntil} onUntil={setRepeatUntil} startDate={dueDate} />
          {repeat !== "none" && repeatUntil && repeatUntil < dueDate && <p className="editor-error" role="alert">Choose an end date on or after the first event.</p>}
          </TaskAddOptions>
          <button onClick={submit} disabled={!title.trim() || !validISO(dueDate) || (repeat !== "none" && repeatUntil && repeatUntil < dueDate)} style={{
            width: "100%", padding: "10px 18px", borderRadius: "var(--radius-control)", border: "none",
            background: title.trim() ? "var(--text-primary)" : "var(--border)",
            color: title.trim() ? "var(--bg)" : "var(--text-muted)",
            fontSize: 13.5, fontWeight: 600, cursor: title.trim() ? "pointer" : "default",
            transition: "all 0.15s ease",
          }}>
            Add
          </button>
        </div>
      )}
      {!open && <button
        type="button"
        onClick={event => {
          if (holdTriggered.current) { holdTriggered.current = false; pressAction.current = undefined; return; }
          const startedWith = pressAction.current;
          pressAction.current = undefined;
          // A pill that expires under a held finger must not become an Add tap.
          if (event.detail > 0 && startedWith !== undefined) {
            if (startedWith !== null) { if (undoEntry?.id === startedWith) onUndo?.(); return; }
            if (undoEntry) return;
          }
          if (undoEntry) onUndo?.(); else setOpen(true);
        }}
        aria-label={undoEntry ? `Undo: ${undoEntry.label}` : "Add event or task"}
        title={undoEntry ? `Undo: ${undoEntry.label}` : lastUndoEntry ? "Add event or task · Hold 2 seconds to undo" : "Add event or task"}
        data-undo={!!undoEntry}
        className="no-press floating-add"
        style={{
          position: "fixed", right: 24, bottom: "max(96px, 11vh)",
          width: undoEntry ? 112 : 54, height: 54, borderRadius: 27,
          background: "var(--text-primary)", color: "var(--bg)",
          border: "none", boxShadow: "var(--shadow-lift)",
          display: "flex", alignItems: "center", justifyContent: "center",
          cursor: "pointer", zIndex: 42,
          transform: `${open ? "rotate(45deg)" : "rotate(0deg)"} scale(${pressed ? 0.9 : 1})`,
          transition: "width .26s cubic-bezier(.22,1,.36,1), transform .15s ease, box-shadow .15s ease",
        }}
        onPointerDown={event => {
          if (!event.isPrimary || event.button !== 0) return;
          cancelHold(); holdTriggered.current = false;
          pressAction.current = undoEntry?.id || null;
          holdOrigin.current = {x:event.clientX,y:event.clientY};
          setPressed(true);
          const id = latestUndo.current?.id;
          if (id) holdTimer.current = setTimeout(() => {
            if (document.visibilityState !== "visible" || latestUndo.current?.id !== id) return;
            holdTriggered.current = true;
            setPressed(false);
            onUndo?.();
          }, 2000);
        }}
        onPointerMove={event => {
          const origin = holdOrigin.current;
          if (origin && Math.hypot(event.clientX-origin.x,event.clientY-origin.y) > 12) { cancelHold(); setPressed(false); }
        }}
        onPointerUp={() => { cancelHold(); setPressed(false); }}
        onPointerLeave={() => { cancelHold(); setPressed(false); }}
        onPointerCancel={() => { cancelHold(); setPressed(false); pressAction.current = undefined; }}
        onContextMenu={event => event.preventDefault()}
      >
        <span className="fab-plus" aria-hidden="true"><Icon name="plus" size={24} /></span>
        <span className="fab-undo" aria-hidden="true">Undo</span>
      </button>}
      <span className="sr-status" role="status">{undoEntry ? `${undoEntry.label}. Undo available.` : ""}</span>
    </>
  );
}

/* ---------- root app ---------- */

function useMobileViewport() {
  useEffect(() => {
    const viewport = window.visualViewport;
    const update = () => {
      // Pinch zoom changes the visual viewport too; it is not a keyboard resize.
      if (viewport && viewport.scale > 1.01) return;
      const height = viewport ? viewport.height : window.innerHeight;
      const inset = viewport ? Math.max(0, window.innerHeight - height - viewport.offsetTop) : 0;
      document.documentElement.style.setProperty("--visual-height", `${height}px`);
      document.documentElement.style.setProperty("--keyboard-inset", `${inset}px`);
    };
    update();
    viewport?.addEventListener("resize", update);
    viewport?.addEventListener("scroll", update);
    window.addEventListener("resize", update);
    return () => {
      viewport?.removeEventListener("resize", update);
      viewport?.removeEventListener("scroll", update);
      window.removeEventListener("resize", update);
    };
  }, []);
}

let openSheetCount = 0;
let sheetPreviousOverflow = "";

function useSheet(open, onClose) {
  useEffect(() => {
    if (!open) return;
    const previous = document.activeElement;
    if (openSheetCount === 0) sheetPreviousOverflow = document.body.style.overflow;
    openSheetCount += 1;
    document.body.dataset.sheetOpen = "true";
    document.body.style.overflow = "hidden";
    const escape = e => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", escape);
    return () => {
      openSheetCount = Math.max(0, openSheetCount - 1);
      if (openSheetCount === 0) {
        document.body.style.overflow = sheetPreviousOverflow;
        delete document.body.dataset.sheetOpen;
      }
      document.removeEventListener("keydown", escape);
      if (previous && previous.isConnected) previous.focus({ preventScroll: true });
    };
  }, [open]);
}

function useAppHaptics() {
  useEffect(() => {
    const feedback = e => {
      if (!e.isTrusted || !(e.target instanceof Element)) return;
      const control = e.target.closest('button, summary, input[type="checkbox"], input[type="radio"]');
      if (!control || control.matches(':disabled,[aria-disabled="true"]') || control.closest('.time-wheel')) return;
      vibrate(control.matches('input[type="checkbox"]') ? 10 : 6);
    };
    document.addEventListener("click", feedback, true);
    return () => document.removeEventListener("click", feedback, true);
  }, []);
}

function useInputModality() {
  useEffect(() => {
    const root = document.documentElement;
    const pointer = () => { root.dataset.inputMode = "pointer"; };
    const keyboard = e => { if (!e.metaKey && !e.ctrlKey && !e.altKey) root.dataset.inputMode = "keyboard"; };
    document.addEventListener("pointerdown", pointer, true);
    document.addEventListener("keydown", keyboard, true);
    return () => {
      document.removeEventListener("pointerdown", pointer, true);
      document.removeEventListener("keydown", keyboard, true);
    };
  }, []);
}

function App() {
  useMobileViewport();
  useInputModality();
  useAppHaptics();
  const initial = useRef(null);
  if (!initial.current) { const saved = loadState(); initial.current = {...saved,tasks:autoCompleteEvents(saved.tasks)}; }
  const initialState = initial.current;
  const [classes, setClasses] = useState(initialState.classes);
  const [records, setRecords] = useState(initialState.tasks);
  const recordsRef = useRef(initialState.tasks);
  const setTasks = useCallback(update => {
    const next = autoCompleteEvents(typeof update === "function" ? update(recordsRef.current) : update);
    recordsRef.current = next;
    setRecords(next);
  }, []);
  const [theme, setTheme] = useState(initialState.theme || "system");
  const [colorTheme, setColorTheme] = useState(() => COLOR_THEMES.some(p => p.key === initialState.colorTheme) ? initialState.colorTheme : "lilac");
  const account = useGoogleAccount({classes,records,theme,colorTheme,setClasses,setTasks,setTheme,setColorTheme});
  const [currentDay, setCurrentDay] = useState(todayISO());
  useEffect(() => {
    const refresh = () => { setCurrentDay(todayISO()); setTasks(current => current); };
    const timer = setInterval(refresh, 15000);
    const resume = () => { if (document.visibilityState === "visible") refresh(); };
    document.addEventListener("visibilitychange", resume);
    return () => { clearInterval(timer); document.removeEventListener("visibilitychange", resume); };
  }, []);
  const tasks = useMemo(() => {
    const projected = expandTasks(records, shiftISO(currentDay, 366)).filter(task => !isCalendarOnly(task));
    const next = {};
    projected.forEach(t => {
      if (t.seriesId && !t.done && t.dueDate > currentDay && (!next[t.seriesId] || t.dueDate < next[t.seriesId])) next[t.seriesId] = t.dueDate;
    });
    // Lists show overdue/current instances and the next scheduled instance per series.
    // The calendar projects every occurrence for whichever dates are being viewed.
    return projected.filter(t => !t.seriesId || t.done || t.dueDate <= currentDay || t.dueDate === next[t.seriesId]);
  }, [records, currentDay]);
  const [editingTask, setEditingTask] = useState(null);
  useEffect(() => { setEditingTask(null); setOpenClassId(null); }, [account.user?.uid]);
  const [calendarDate, setCalendarDate] = useState(todayISO());
  const [burst, setBurst] = useState(null);
  useEffect(() => { if (!burst) return; const timer = setTimeout(() => setBurst(null), 1200); return () => clearTimeout(timer); }, [burst]);

  useEffect(() => { document.documentElement.dataset.palette = colorTheme; }, [colorTheme]);
  const [tab, setTab] = useState("classes");
  const [openClassId, setOpenClassId] = useState(null);
  useEffect(() => {
    if (!account.loading) saveState({ classes, tasks: records, theme, colorTheme }, account.storageKey);
  }, [classes, records, theme, colorTheme, account.loading, account.storageKey]);

  const enterSync = useCallback(async rawCode => {
    const code = rawCode.trim().toLowerCase();
    if (!/^[a-z]+-[a-z]+-\d{2}$/.test(code)) throw new Error("Enter the full backup code, such as swift-tiger-42.");
    const recovered = await pullFromCloud(code);
    if (!recovered) throw new Error("No backup was found for that code. Nothing was changed.");
    if (!validPlannerData(recovered)) throw new Error("That backup is incomplete. Nothing was changed.");
    const merged = mergePlannerData({classes,tasks:recordsRef.current}, recovered);
    setClasses(merged.classes); setTasks(merged.tasks);
  }, [classes,setTasks]);

  useEffect(() => {
    const root = document.documentElement;
    const apply = () => {
      let mode = theme;
      if (theme === "system") {
        mode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      root.setAttribute("data-theme", mode);
    };
    apply();
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (theme === "system") {
      mq.addEventListener("change", apply);
      return () => mq.removeEventListener("change", apply);
    }
  }, [theme]);

  const addTask = useCallback((classId, title, dueDate, options = {}) => {
    setTasks(t => [...t, { id: uid(), classId, title, done: false, dueDate: dueDate || tomorrowISO(), createdAt: Date.now(), isEvent: !!options.isEvent, time: validEventTime(options.time) ? options.time : "", notify: validEventTime(options.time) && !!options.notify, repeat: options.repeat || "none", repeatUntil: options.repeatUntil || "", instances: {} }]);
  }, [setTasks]);

  const [undoStack, setUndoStack] = useState([]);
  const [undoVisible, setUndoVisible] = useState(false);
  const undoTimerRef = useRef(null);
  useEffect(() => { setUndoStack([]); setUndoVisible(false); clearTimeout(undoTimerRef.current); }, [account.user?.uid]);

  useEffect(() => () => clearTimeout(undoTimerRef.current), []);
  const pushUndo = useCallback(entry => {
    setUndoStack([{ ...entry, id: uid(), owner: account.user?.uid || "guest" }]);
    setUndoVisible(true);
    clearTimeout(undoTimerRef.current);
    undoTimerRef.current = setTimeout(() => setUndoVisible(false), 3000);
  }, [account.user?.uid]);

  const undoLast = useCallback(() => {
    const entry = undoStack[0];
    if (entry && entry.owner === (account.user?.uid || "guest")) entry.restore();
    setUndoStack([]);
    setUndoVisible(false);
    clearTimeout(undoTimerRef.current);
  }, [undoStack, account.user?.uid]);

  const toggleTask = useCallback((taskId, origin) => {
    const task = resolveTask(recordsRef.current, taskId);
    if (!task || task.deleted) return;
    const done = !task.done;
    if (done) {
      pushUndo({ label: "Task completed", restore: () => setTasks(t => patchTask(t, taskId, { done: false, completedAt: null })) });
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        setBurst({ id: uid(), x: origin?.x ?? window.innerWidth / 2, y: origin?.y ?? window.innerHeight * .45 });
      }
    }
    setTasks(t => patchTask(t, taskId, { done, completedAt: done ? Date.now() : null }));
  }, [pushUndo, setTasks]);

  const deleteTask = useCallback(taskId => {
    const task = resolveTask(recordsRef.current, taskId);
    if (!task) return;
    if (task.seriesId) {
      const previous = { ...(recordsRef.current.find(t => t.id === task.seriesId)?.instances || {})[task.occurrenceDate] };
      pushUndo({ label: "Occurrence deleted", restore: () => setTasks(t => patchTask(t, taskId, { ...previous, deleted: false })) });
      setTasks(t => patchTask(t, taskId, { deleted: true }));
    } else {
      pushUndo({ label: "Task deleted", restore: () => setTasks(t => t.some(x => x.id === task.id) ? t : [...t, task]) });
      setTasks(t => t.filter(x => x.id !== taskId));
    }
  }, [pushUndo, setTasks]);

  const deleteSeries = useCallback(task => {
    const source = recordsRef.current.find(t => t.id === (task.seriesId || task.id));
    if (!source) return;
    pushUndo({ label: "Series deleted", restore: () => setTasks(t => t.some(x => x.id === source.id) ? t : [...t, source]) });
    setTasks(t => t.filter(x => x.id !== source.id));
  }, [pushUndo, setTasks]);

  const editTask = useCallback((task, changes, scope) => {
    const source = recordsRef.current.find(t => t.id === (task.seriesId || task.id));
    if (!source) return;
    setTasks(t => editTaskRecords(t, task, changes, scope));
    pushUndo({ label: "Event updated", restore: () => setTasks(t => t.map(x => x.id === source.id ? source : x)) });
  }, [pushUndo, setTasks]);

  const addClass = useCallback((name, category) => {
    const color = PALETTE[classes.length % PALETTE.length];
    setClasses(c => [...c, { id: uid(), name, color, category: category || "class" }]);
  }, [classes.length]);

  const renameClass = useCallback((id, name) => {
    setClasses(c => c.map(cls => cls.id === id ? { ...cls, name } : cls));
  }, []);

  const recolorClass = useCallback((id, color) => {
    setClasses(c => c.map(cls => cls.id === id ? { ...cls, color } : cls));
  }, []);

  const reorderClasses = useCallback((draggedId, targetId) => {
    setClasses(c => {
      const list = [...c];
      const fromIdx = list.findIndex(cls => cls.id === draggedId);
      const toIdx = list.findIndex(cls => cls.id === targetId);
      if (fromIdx === -1 || toIdx === -1) return c;
      const [moved] = list.splice(fromIdx, 1);
      list.splice(toIdx, 0, moved);
      return list;
    });
  }, []);

  const deleteClass = useCallback((id) => {
    setClasses(c => {
      const removedClass = c.find(cls => cls.id === id);
      setTasks(t => {
        const removedTasks = t.filter(task => task.classId === id);
        if (removedClass) {
          pushUndo({
            label: `${removedClass.name} deleted`,
            restore: () => {
              setClasses(c2 => [...c2, removedClass]);
              setTasks(t2 => [...t2, ...removedTasks]);
            },
          });
        }
        return t.filter(task => task.classId !== id);
      });
      return c.filter(cls => cls.id !== id);
    });
    setOpenClassId(null);
    setTab("classes");
  }, [pushUndo]);

  const exportData = useCallback(() => {
    const data = JSON.stringify({ classes, tasks: records, theme, colorTheme }, null, 2);
    const blob = new Blob([data], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "classes-backup.json";
    a.click();
    URL.revokeObjectURL(url);
  }, [classes, records, theme, colorTheme]);

  const openClass = classes.find(c => c.id === openClassId);

  let content;
  if (openClass) {
    content = (
      <ClassScreen
        cls={openClass}
        tasks={tasks.filter(t => t.classId === openClass.id)}
        onBack={() => setOpenClassId(null)}
        onAdd={(title, dueDate, options) => addTask(openClass.id, title, dueDate, options)}
        onToggle={toggleTask}
        onDelete={deleteTask}
        onRename={(name) => renameClass(openClass.id, name)}
        onColorChange={(color) => recolorClass(openClass.id, color)}
        onDeleteClass={() => deleteClass(openClass.id)}
      />
    );
  } else if (tab === "classes") {
    content = <Dashboard classes={classes} tasks={tasks} records={records} onOpenClass={setOpenClassId} onAddClass={addClass} onAddTask={addTask} onReorder={reorderClasses} onToggleTask={toggleTask} />;
  } else if (tab === "calendar") {
    content = <CalendarScreen classes={classes} records={records} onToggle={toggleTask} onEdit={setEditingTask} onDateChange={setCalendarDate} />;
  } else if (tab === "all") {
    content = <AllTasksScreen classes={classes} tasks={tasks} onToggle={toggleTask} onDelete={deleteTask} onOpenClass={setOpenClassId} onEdit={setEditingTask} />;
  } else {
    content = (
      <SettingsScreen
        theme={theme} onThemeChange={setTheme} colorTheme={colorTheme} onColorThemeChange={setColorTheme} classes={classes} tasks={tasks} onExport={exportData}
        account={account} onEnterSync={enterSync}
      />
    );
  }

  return (
    <div id="app-shell" style={{ display: "flex", flexDirection: "column" }}>
      <main key={`${account.user?.uid || "guest"}:${openClass ? `class-${openClass.id}` : tab}`} className="screen-stage" style={{ flex: 1 }}>{account.loading ? <div className="account-loading" role="status">Loading your account…</div> : content}</main>
      <NavBar tab={openClass ? "classes" : tab} setTab={(t) => { setOpenClassId(null); setTab(t); }} />
      {!account.loading && <FloatingAdd key={`add:${account.user?.uid || "guest"}`} classes={classes} activeClassId={openClass ? openClass.id : null} onAdd={addTask} defaultDueDate={tab === "calendar" ? calendarDate : null} undoEntry={undoVisible && undoStack[0]?.owner === (account.user?.uid || "guest") ? undoStack[0] : null} lastUndoEntry={undoStack[0]?.owner === (account.user?.uid || "guest") ? undoStack[0] : null} onUndo={undoLast} />}
      {!account.loading && editingTask && <EditTaskSheet task={editingTask} source={records.find(t => t.id === (editingTask.seriesId || editingTask.id)) || editingTask} classes={classes} onSave={editTask} onDelete={deleteTask} onDeleteSeries={deleteSeries} onClose={() => setEditingTask(null)} />}
      {!account.loading && <ReminderCenter key={`reminder:${account.user?.uid || "guest"}`} records={records} />}
      <Confetti burst={burst} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
