<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Classes</title>
<meta name="description" content="Organize your classes, tasks, and everyday events in one simple calendar." />

<!-- PWA / home screen icon setup -->
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/png" href="./classes-dark-liquid-glass-icon.png" />
<link rel="apple-touch-icon" href="./classes-dark-liquid-glass-icon.png" />
<meta name="theme-color" content="#1c1c1e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Classes" />

<style>
  :root {
    --bg: #FAFAF8;
    --surface: #FFFFFF;
    --surface-raised: #FFFFFF;
    --border: rgba(20,20,18,0.08);
    --border-strong: rgba(20,20,18,0.14);
    --text-primary: #1C1C1A;
    --text-secondary: #6B6B66;
    --text-muted: #A3A39C;
    --shadow: 0 1px 2px rgba(20,20,18,0.04), 0 1px 8px rgba(20,20,18,0.03);
    --shadow-lift: 0 4px 16px rgba(20,20,18,0.08), 0 1px 3px rgba(20,20,18,0.06);
    /* Shared rounded geometry across all interface surfaces and controls. */
    --radius-iphone: 40px;
    --radius-card: var(--radius-iphone);
    --radius-control: var(--radius-iphone);
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, sans-serif;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #171715;
    --surface: #201F1D;
    --surface-raised: #262523;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text-primary: #F2F1ED;
    --text-secondary: #9C9B96;
    --text-muted: #6E6D68;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 1px 8px rgba(0,0,0,0.15);
    --shadow-lift: 0 8px 24px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.3);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { min-height: 100%; }
  body { min-height: 100vh; min-height: 100dvh; }
  #app-shell { min-height: 100vh; min-height: 100dvh; animation: appFadeIn 0.35s ease; }
  @keyframes appFadeIn { from { opacity: 0; } to { opacity: 1; } }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    /* push content below the notch/status bar and above the home indicator
       when running as an installed home-screen app (safe-area-inset-* is 0
       in normal browser tabs, so this has no effect there) */
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  #root { min-height: 100vh; min-height: 100dvh; }
  button { font-family: inherit; }
  button:not(.no-press) {
    transition: transform 0.12s cubic-bezier(0.4,0,0.2,1), opacity 0.12s ease, background 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  button:not(.no-press):active {
    transform: scale(0.96);
  }
  ::selection { background: rgba(120,120,255,0.25); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes popIn { from { opacity: 0; transform: translateY(6px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes riseInCenter { from { opacity: 0; transform: translateX(-50%) translateY(12px) scale(0.96); } to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } }

  /* iPhone layout: readable fields, safe-area spacing, and reachable controls. */
  html { -webkit-text-size-adjust: 100%; }
  input, select, textarea { font-family: inherit; min-width: 0; max-width: 100%; }
  button { touch-action: manipulation; }
  h1 { min-width: 0; overflow-wrap: anywhere; }
  .native-date { display: none; }
  .touch-reorder { display: none; }
  @media (max-width: 639px), (pointer: coarse), (max-width: 956px) and (max-height: 500px) {
    input, select, textarea { font-size: 16px !important; }
    button { min-height: 44px; min-width: 44px; }
    .native-date { display: flex; align-items: center; gap: 6px; }
    .native-date input { min-height: 44px; width: 100%; border: 0; background: transparent; color: inherit; }
    .custom-date { display: none !important; }
    .touch-reorder { display: flex; flex-direction: column; }
    .desktop-grip { display: none !important; }
    .touch-reorder button { padding: 4px; background: none; border: none; color: var(--text-secondary); }
    .touch-reorder button:disabled { opacity: .25; }
  }
  @media (max-width: 639px), (max-width: 956px) and (max-height: 500px) {
    body { padding-bottom: 0; }
    #app-shell { min-height: calc(100dvh - env(safe-area-inset-top, 0px)); }
    .screen { padding: 0 16px calc(176px + env(safe-area-inset-bottom, 0px)) !important; }
    .bottom-nav { position: fixed !important; z-index: 30; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)) !important; }
    .bottom-nav > div { width: 100%; max-width: 460px; justify-content: space-around; border-radius: var(--radius-iphone) !important; }
    .bottom-nav button { flex: 1; min-width: 0; flex-direction: column; gap: 4px !important; padding: 8px 2px !important; font-size: 11px !important; }
    .bottom-nav button span { display: inline !important; }
    .floating-add { right: max(16px, env(safe-area-inset-right, 0px)) !important; bottom: calc(92px + env(safe-area-inset-bottom, 0px)) !important; }
    .task-row { display: grid !important; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 4px 8px !important; max-height: none; }
    .task-row:not([data-leaving="true"]) { max-height: none !important; }
    .task-title { grid-column: 2; min-width: 0; overflow-wrap: anywhere; }
    .task-due { grid-column: 2; grid-row: 2; justify-self: start; }
    .task-row > button:first-child { grid-column: 1; grid-row: 1 / span 2; width: 44px !important; height: 44px !important; }
    .task-delete { grid-column: 3; grid-row: 1 / span 2; justify-content: center; align-self: center; }
    .quick-add { flex-wrap: wrap; }
    .quick-add > input { flex-basis: calc(100% - 60px) !important; min-height: 44px; }
    .quick-add > .date-control { order: 3; flex-basis: 100%; }
    .class-open { min-width: 0; }
    .mobile-sheet {
      top: auto !important; bottom: calc(var(--keyboard-inset, 0px) + 12px) !important;
      left: max(12px, env(safe-area-inset-left, 0px)) !important;
      right: max(12px, env(safe-area-inset-right, 0px)) !important;
      width: auto !important; transform: none !important;
      max-height: calc(var(--visual-height, 100dvh) - env(safe-area-inset-top, 0px) - 24px);
      overflow-y: auto; overscroll-behavior: contain; animation: fadeIn .18s ease !important;
      padding-bottom: max(18px, env(safe-area-inset-bottom, 0px)) !important;
    }
    .sheet-fields { flex-wrap: wrap; }
    .sheet-fields > select, .sheet-fields > .date-control { flex-basis: 100%; width: 100%; }
    .undo-toast { right: max(16px, env(safe-area-inset-right, 0px)) !important; bottom: calc(92px + env(safe-area-inset-bottom, 0px)) !important; width: min(360px, calc(100% - 32px)); }
    .undo-toast > div > span { white-space: normal !important; overflow-wrap: anywhere; min-width: 0; flex: 1; }
    .undo-toast button { flex-shrink: 0; }
    .month-grid button { min-width: 0; }
    .color-swatch { min-width: 44px; min-height: 44px; }
  }


  /* A small motion system: quick feedback, gentle arrivals, no looping effects. */
  :root { --accent: #7772CE; --accent-soft: #EEEDF9; --ease-out: cubic-bezier(.22,1,.36,1); }
  [data-theme="dark"] { --accent: #B9B3FF; --accent-soft: #2B2940; }
  /* Paint one continuous backdrop over the full document, including long pages.
     No repeating viewport-sized tiles or abrupt color reset while scrolling. */
  body {
    background-image:
      radial-gradient(ellipse 110vw 760px at 50% 0%, var(--accent-soft) 0%, transparent 100%),
      radial-gradient(ellipse 110vw 860px at 65% 100%, var(--accent-soft) 0%, transparent 100%);
    background-repeat: no-repeat;
    background-size: 100% 100%;
  }
  .screen-stage { animation: screenArrive .34s var(--ease-out) both; }
  @keyframes screenArrive { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .class-list > div { animation: cardArrive .42s var(--ease-out) both; animation-delay: var(--arrival-delay, 0ms); }
  @keyframes cardArrive { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
  .class-card { position: relative; }
  .class-card::before { content: ""; position: absolute; top: 24px; bottom: 24px; left: 12px; width: 3px; border-radius: var(--radius-iphone); background: var(--class-color); opacity: .7; pointer-events: none; }
  .class-open:active { transform: scale(.985) !important; }
  .class-open > div:first-child { transition: transform .3s var(--ease-out); }
  .class-open[aria-expanded="true"] > div:first-child { transform: rotate(-7deg) scale(1.06); }
  .class-list { position: relative; }
  .task-enter { animation: cardArrive .26s var(--ease-out) both; }
  .task-check { position: relative; }
  .task-check[data-celebrating="true"] { animation: checkPop .4s var(--ease-out); background: var(--check-color) !important; border-color: var(--check-color) !important; }
  .task-check[data-celebrating="true"]::after { content: ""; position: absolute; inset: -5px; border: 2px solid var(--check-color); border-radius: 50%; animation: checkRing .45s ease-out both; pointer-events: none; }
  @keyframes checkPop { 0% { transform: scale(.85); } 45% { transform: scale(1.14); } 100% { transform: scale(1); } }
  @keyframes checkRing { from { opacity: .8; transform: scale(.75); } to { opacity: 0; transform: scale(1.45); } }
  .task-row[data-completing="true"] .task-title { color: var(--text-secondary) !important; text-decoration: line-through; }
  .focus-card { position: relative; overflow: hidden; padding: 22px; margin: 0 0 24px; border: 1px solid var(--border); border-radius: var(--radius-iphone); background: linear-gradient(135deg, var(--accent-soft), var(--surface)); box-shadow: var(--shadow); }
  .focus-top { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
  .eyebrow { margin: 0 0 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
  .focus-title { margin: 0; font-size: clamp(23px, 5.8vw, 29px); font-weight: 700; letter-spacing: -.04em; line-height: 1.15; }
  .focus-copy { margin: 9px 0 0; color: var(--text-secondary); font-size: 13px; line-height: 1.5; }
  .focus-emblem { flex-shrink: 0; width: 48px; height: 48px; border-radius: var(--radius-iphone); background: var(--surface); color: var(--accent); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg); box-shadow: var(--shadow); }
  .focus-track { height: 5px; background: var(--border); border-radius: var(--radius-iphone); margin-top: 20px; overflow: hidden; }
  .focus-fill { height: 100%; background: var(--accent); border-radius: inherit; transition: width .6s var(--ease-out); transform-origin: left; animation: progressArrive .65s var(--ease-out) both; }
  @keyframes progressArrive { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .focus-meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 9px; font-size: 11px; color: var(--text-secondary); }
  .nav-track { position: relative; width: 460px; max-width: 100%; gap: 0 !important; isolation: isolate; }
  .nav-track > button { flex: 1; min-width: 0; justify-content: center; padding-left: 4px !important; padding-right: 4px !important; z-index: 1; background: transparent !important; }
  .nav-pill { position: absolute; z-index: 0; left: 6px; top: 6px; bottom: 6px; width: calc((100% - 12px) / 4); background: var(--text-primary); border-radius: var(--radius-iphone); transform: translateX(calc(var(--active-tab) * 100%)); transition: transform .38s cubic-bezier(.22,1,.36,1); pointer-events: none; }
  @keyframes navPop { from { transform: translateY(3px) scale(.85); } to { transform: none; } }
  .floating-add { background: var(--accent) !important; color: var(--on-accent) !important; box-shadow: 0 3px 8px rgba(0,0,0,.16) !important; animation: fabArrive .45s var(--ease-out) both; }
  [data-theme="dark"] .floating-add { color: var(--on-accent) !important; }
  @keyframes fabArrive { from { opacity: 0; translate: 0 12px; scale: .85; } to { opacity: 1; translate: 0; scale: 1; } }
  .quick-add:focus-within { border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accent-soft); transition: box-shadow .2s ease, border-color .2s ease; }
  .mobile-sheet input:focus { border-color: var(--accent) !important; }
  .sheet-step { animation: screenArrive .24s var(--ease-out); }
  .centered-sheet { animation: dialogSpring .3s var(--ease-out) both !important; }
  @keyframes dialogSpring { from { opacity: 0; transform: translate(-50%, -46%) scale(.96); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  .undo-toast { filter: drop-shadow(0 5px 16px #0001); }
  .toast-check { display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0; animation: checkPop .4s var(--ease-out); }
  .empty-orbit { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: var(--radius-iphone); display: flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); transform: rotate(-8deg); animation: cardArrive .5s var(--ease-out) both; }
  @media (hover: hover) and (pointer: fine) {
    .class-card:hover { box-shadow: var(--shadow-lift) !important; border-color: var(--border-strong) !important; }
    .floating-add:hover { scale: 1.06; }
    .touch-reorder button:hover { color: var(--accent); }
  }
  @media (max-width: 639px), (max-width: 956px) and (max-height: 500px) {
    .mobile-sheet { animation: sheetSpring .36s var(--ease-out) both !important; }
    @keyframes sheetSpring { from { opacity: 0; translate: 0 28px; } to { opacity: 1; translate: 0; } }
    .focus-card { padding: 20px; }
    .focus-emblem { width: 42px; height: 42px; border-radius: var(--radius-iphone); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
    .task-check::after { display: none; }
  }

  .field-label { display: block; margin: 0 0 13px; font-size: 12px; font-weight: 650; color: var(--text-secondary); }
  .field-label > input, .field-label > select { display: block; width: 100%; margin-top: 7px; padding: 11px 12px; min-height: 44px; font: inherit; font-size: 16px; border-radius: var(--radius-iphone); border: 1px solid var(--border-strong); background: var(--bg); color: var(--text-primary); }
  .field-label > :disabled { opacity: .6; }
  .field-optional { font-weight: 400; }
  .editor-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .editor-heading h2 { margin: 0; font-size: 20px; letter-spacing: -.03em; }
  .quiet-icon { display: inline-flex; align-items: center; justify-content: center; width: 44px; min-height: 44px; flex-shrink: 0; background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border); border-radius: var(--radius-iphone); cursor: pointer; }
  .edit-backdrop { position: fixed; inset: 0; z-index: 60; background: #0005; backdrop-filter: blur(4px); animation: fadeIn .16s ease; }
  .edit-sheet { position: fixed; z-index: 61; top: 50%; left: 50%; transform: translate(-50%,-50%); width: min(440px,calc(100vw - 32px)); max-height: calc(100dvh - 40px); overflow-y: auto; background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-iphone); padding: 20px; box-shadow: var(--shadow-lift); }
  .primary-action { width: 100%; min-height: 46px; border: none; border-radius: var(--radius-iphone); background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 650; cursor: pointer; }
  [data-theme="dark"] .primary-action { color: var(--on-accent); }
  .primary-action:disabled { opacity: .4; cursor: default; }
  .delete-event { display: block; width: 100%; min-height: 44px; border: none; background: none; color: #C15B5B; margin-top: 8px; font: inherit; font-size: 13px; cursor: pointer; }
  .editor-hint, .editor-error { font-size: 12px; line-height: 1.5; margin: 0 0 14px; color: var(--text-secondary); }
  .editor-error { color: #C15B5B; }
  .calendar-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 28px 0 16px; }
  .calendar-heading h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
  .segmented-control { position: relative; display: inline-grid; grid-template-columns: repeat(var(--segment-count), minmax(0, 1fr)); gap: 0; padding: 3px; isolation: isolate; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-iphone); }
  .segmented-control > button { position: relative; z-index: 1; min-width: 44px; padding: 8px 13px; border: none; border-radius: var(--radius-iphone); background: transparent; color: var(--text-secondary); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: color .18s ease; }
  .segmented-control > button[aria-pressed="true"] { color: var(--bg); }
  .segment-pill { position: absolute; z-index: 0; left: 3px; top: 3px; bottom: 3px; width: calc((100% - 6px) / var(--segment-count)); border-radius: var(--radius-iphone); background: var(--text-primary); transform: translateX(calc(var(--active-segment) * 100%)); pointer-events: none; }
  .segment-pill, .nav-pill { transition: transform .38s cubic-bezier(.22,1,.36,1); }
  .calendar-controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .calendar-controls > button:nth-child(2) { flex: 1; min-width: 0; background: none; border: none; color: var(--text-primary); font: inherit; font-size: 16px; font-weight: 650; cursor: pointer; }
  .calendar-hint { color: var(--text-secondary); font-size: 12px; line-height: 1.5; margin: 14px 0 20px; }
  .calendar-event { display: grid; grid-template-columns: 44px minmax(0,1fr) 44px; gap: 4px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--event-color); border-radius: var(--radius-iphone); padding: 8px 6px; margin: 8px 0; touch-action: pan-y; -webkit-touch-callout: none; user-select: none; transition: transform .16s ease, box-shadow .16s ease, opacity .2s ease; }
  .calendar-event[data-pressing="true"] { transform: scale(.985); box-shadow: 0 0 0 3px var(--accent-soft); }
  .event-check-target { display: flex; align-items: center; justify-content: center; min-height: 44px; width: 44px; cursor: pointer; }
  .event-check-target input { accent-color: var(--event-color); width: 22px; height: 22px; margin: 0; cursor: pointer; }
  .event-copy { min-width: 0; }
  .event-title { overflow-wrap: anywhere; font-size: 15px; font-weight: 550; line-height: 1.45; color: var(--text-primary); }
  .event-meta { margin-top: 4px; color: var(--text-secondary); font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
  .calendar-event[data-done="true"] .event-title, .calendar-event[data-done="true"] .event-title-button { text-decoration: line-through; color: var(--text-secondary); }
  .calendar-event[data-done="true"] { border-left-color: var(--text-muted); }
  .event-edit { display: flex; align-items: center; justify-content: center; width: 44px; min-height: 44px; border: none; background: none; color: var(--text-secondary); border-radius: var(--radius-iphone); cursor: pointer; }
  .event-edit:active { background: var(--accent-soft); }
  .calendar-month { padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-iphone); }
  .month-labels, .month-cells { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); gap: 4px; }
  .month-labels span { text-align: center; color: var(--text-secondary); font-size: 11px; padding: 6px 0 10px; }
  .month-cell { border: 1px solid var(--border); border-radius: var(--radius-iphone); min-width: 0; min-height: 100px; overflow: hidden; }
  .month-cell[data-selected="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .month-date { display: flex; flex-direction: column; gap: 3px; align-items: center; justify-content: center; min-width: 0; width: 100%; min-height: 44px; border: none; background: none; color: var(--text-primary); font: inherit; font-size: 13px; cursor: pointer; border-radius: var(--radius-iphone); }
  .month-cell[data-today="true"] .month-date { color: var(--accent); font-weight: 750; }
  .month-dots { display: none; gap: 3px; height: 4px; }
  .month-dots i { width: 4px; height: 4px; border-radius: 50%; }
  .month-inline-events { padding: 0 8px 12px; }
  .event-compact { grid-template-columns: 28px minmax(0,1fr); padding: 1px 1px 1px 0; border-radius: var(--radius-iphone); gap: 0; margin: 3px 0; }
  .event-compact .event-check-target { min-height: 32px; width: 28px; }
  .event-compact input { width: 16px; height: 16px; }
  .event-title-button { min-width: 0; min-height: 32px; width: 100%; padding: 3px; text-align: left; font: inherit; font-size: 11px; line-height: 1.4; border: none; color: var(--text-primary); background: none; cursor: pointer; overflow-wrap: anywhere; }
  .more-events { min-width: 0; min-height: 28px; border: none; background: none; font-size: 10px; color: var(--text-secondary); width: 100%; cursor: pointer; }
  .calendar-agenda { margin-top: 20px; }
  .calendar-agenda h2 { font-size: 15px; font-weight: 650; }
  .week-day { margin-bottom: 14px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-iphone); background: var(--surface); }
  .week-day[data-today="true"] { border-color: var(--accent); }
  .week-day-label { min-height: 44px; padding: 4px; border: none; background: none; color: var(--text-primary); font: inherit; font-size: 13px; font-weight: 650; cursor: pointer; }
  .calendar-empty-day { color: var(--text-secondary); font-size: 12px; margin: 4px; }
  .calendar-empty { padding: 32px 12px; color: var(--text-secondary); text-align: center; }

function useGoogleAccount({classes,records,theme,colorTheme,setClasses,setTasks,setTheme,setColorTheme}) {
  const dataRef=useRef({classes,tasks:records,theme,colorTheme}); dataRef.current={classes,tasks:records,theme,colorTheme};
  const controller=useRef(null);
  const [state,setState]=useState({user:null,status:location.protocol === "file:" ? "guest" : "loading",error:"",loading:location.protocol !== "file:",storageKey:STORAGE_KEY,pending:null});
  useEffect(()=>{
    let unsubscribe=null, disposed=false;
    const startupTimer=setTimeout(()=>{
      if (!disposed && !controller.current) setState(s=>({...s,status:"guest",loading:false,error:"Account connection is taking longer than expected. Your device data is available; reconnect to restore sign-in."}));
    },12000);
    const attach=()=>{
      if(disposed||controller.current||!window.__accountAuth)return;
      const engine=new AccountSyncController({cloud:window.__accountCloud,storage:localStorage,readLocal:()=>dataRef.current,apply:data=>{dataRef.current=data;setClasses(data.classes);setTasks(data.tasks);setTheme(data.theme || "system");setColorTheme(data.colorTheme || "lilac");},onState:setState});
      controller.current=engine;
      clearTimeout(startupTimer);
      unsubscribe=window.__accountAuth.subscribe(user=>engine.connect(user));
    };
    attach(); window.addEventListener("firebase-ready",attach);
    const resume=()=>{if(document.visibilityState==="visible")controller.current?.refresh();};
    const timer=setInterval(resume,30000);
    document.addEventListener("visibilitychange",resume); window.addEventListener("online",resume);
    return()=>{disposed=true;clearTimeout(startupTimer);unsubscribe?.();controller.current?.stop();controller.current=null;clearInterval(timer);window.removeEventListener("firebase-ready",attach);document.removeEventListener("visibilitychange",resume);window.removeEventListener("online",resume);};
  },[]);
  useEffect(()=>{controller.current?.changed();},[classes,records,theme,colorTheme]);
  const signIn=()=>{
    if(location.protocol==="file:"){setState(s=>({...s,error:"Google sign-in works on your published HTTPS website, not the local file preview."}));return;}
    if(!window.__accountAuth){setState(s=>({...s,error:"Google sign-in hasn't loaded. Check your connection and try again."}));return;}
    // Start the popup directly inside the tap, before any awaited work.
    window.__accountAuth.signIn().catch(error=>setState(s=>({...s,error:accountError(error)})));
  };
  const signOut=async()=>{
    try {
      if(controller.current?.writing){setState(s=>({...s,error:"Please wait for the current save to finish before signing out."}));return;}
      await controller.current?.flush();

    }catch(error){setState(s=>({...s,error:accountError(error)}));}

}

  const diffDays = Math.round((d - now) / 86400000);

}

function computeStreak(tasks) {

    const dueThatDay = tasks.filter(t => t.dueDate === iso);
    if (dueThatDay.length === 0) return true;
    return dueThatDay.every(t => {
      if (!t.done || !t.completedAt) return false;
      const completedIso = isoFromDate(new Date(t.completedAt));
      return completedIso <= iso;
    });
  };

  // Earliest date any task was ever due or completed — we never count a
  // streak further back than this, so an empty history doesn't look infinite.
  const allDates = [];
  tasks.forEach(t => {
    if (t.dueDate) allDates.push(t.dueDate);

  const startDay = dayPasses(today) ? today : yesterday;

  if (!dayPasses(startDay)) return 0;

function useIsMobile(breakpoint) {
  const bp = breakpoint || 640;
  const [isMobile, setIsMobile] = useState(() => typeof window !== "undefined" && window.innerWidth < bp);
  useEffect(() => {
    const handler = () => setIsMobile(window.innerWidth < bp);

/* ---------- reusable mini calendar popover for picking a date ---------- */

function MiniCalendarPopover({ value, onSelect, onClose, anchorRect }) {
  const initial = value ? dateFromISO(value) : new Date();
  const [cursor, setCursor] = useState({ year: initial.getFullYear(), month: initial.getMonth() });
  const popRef = useRef(null);

  useEffect(() => {
    const handleClick = (e) => {
      if (popRef.current && !popRef.current.contains(e.target)) onClose();
    };
    document.addEventListener("mousedown", handleClick);
    document.addEventListener("touchstart", handleClick, { passive: true });
    return () => {
      document.removeEventListener("mousedown", handleClick);
      document.removeEventListener("touchstart", handleClick);
    };
  }, [onClose]);

  const { year, month } = cursor;
  const monthLabel = new Date(year, month, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = todayISO();

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const goMonth = (delta) => {
    let m = month + delta, y = year;
    if (m < 0) { m = 11; y -= 1; }
    if (m > 11) { m = 0; y += 1; }
    setCursor({ year: y, month: m });
  };

  const weekdayLabels = ["S", "M", "T", "W", "T", "F", "S"];

  const POP_WIDTH = typeof window === "undefined" ? 336 : Math.min(336, window.innerWidth - 32);
  const POP_HEIGHT_EST = 380;
  let top = anchorRect ? anchorRect.bottom + 6 : 0;
  let left = anchorRect ? anchorRect.right - POP_WIDTH : 0;
  if (typeof window !== "undefined") {
    left = Math.max(8, Math.min(left, window.innerWidth - POP_WIDTH - 8));
    if (anchorRect && top + POP_HEIGHT_EST > window.innerHeight) {
      top = Math.max(8, anchorRect.top - POP_HEIGHT_EST - 6);
    }
  }

  const content = (
    <div
      ref={popRef}
      role="dialog" aria-label="Choose due date"
      onKeyDown={event => { if (event.key === "Escape") { event.stopPropagation(); onClose(); } }}
      style={{
        position: "fixed", top, left, zIndex: 9999,
        background: "var(--surface-raised)", border: "1px solid var(--border)",
        borderRadius: "var(--radius-iphone)", boxShadow: "var(--shadow-lift)", padding: 12,
        width: POP_WIDTH,
        animation: "popIn 0.15s cubic-bezier(0.34, 1.56, 0.64, 1)",
      }}
    >
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
        <button type="button" aria-label="Previous month" onClick={() => goMonth(-1)} style={{
          background: "none", border: "none", cursor: "pointer", color: "var(--text-secondary)",
          padding: 4, display: "flex", borderRadius: "var(--radius-iphone)",
        }}>
          <Icon name="chevron" size={14} style={{ transform: "rotate(180deg)" }} />
        </button>
        <div style={{ fontSize: 12.5, fontWeight: 600 }}>{monthLabel}</div>
        <button type="button" aria-label="Next month" onClick={() => goMonth(1)} style={{
          background: "none", border: "none", cursor: "pointer", color: "var(--text-secondary)",
          padding: 4, display: "flex", borderRadius: "var(--radius-iphone)",
        }}>
          <Icon name="chevron" size={14} />
        </button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2, marginBottom: 2 }}>
        {weekdayLabels.map((w, i) => (
          <div key={i} style={{ textAlign: "center", fontSize: 9.5, fontWeight: 600, color: "var(--text-muted)", padding: "2px 0" }}>{w}</div>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2 }}>
        {cells.map((d, i) => {
          if (d === null) return <div key={i} />;
          const iso = isoFromDate(new Date(year, month, d));
          const isToday = iso === today;
          const isSelected = iso === value;
          return (
            <button
              type="button"
              key={i}
              onClick={() => { onSelect(iso); onClose(); }}
              style={{
                minWidth: 0, minHeight: 40, aspectRatio: "1", display: "flex", alignItems: "center", justifyContent: "center",
                borderRadius: "var(--radius-iphone)", border: "none", cursor: "pointer", fontSize: 11.5,
                background: isSelected ? "var(--text-primary)" : (isToday ? "var(--bg)" : "transparent"),
                color: isSelected ? "var(--bg)" : "var(--text-primary)",
                fontWeight: isToday || isSelected ? 700 : 500,
              }}
            >
              {d}
            </button>
          );
        })}
      </div>
    </div>
  );

  return ReactDOM.createPortal(content, document.body);
}

function TaskRow({ task, color, onToggle, onDelete, onEdit }) {

        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        onTouchCancel={() => { setDragging(false); setDragX(0); axisLocked.current = null; }}
        style={{
          display: "flex", alignItems: "center", gap: 12,
          padding: "13px 4px",
          borderBottom: "1px solid var(--border)",
          background: "var(--surface)",
          opacity: leaving ? 0 : 1,
          transform: leaving
            ? "translateX(24px) scale(0.98)"
            : `translateX(${dragX}px)`,
          maxHeight: leaving ? 0 : (height ? height + 40 : 80),
          paddingTop: leaving ? 0 : 13,
          paddingBottom: leaving ? 0 : 13,
          overflow: "hidden",
          transition: dragging

          touchAction: "pan-y",

      >
        <TaskCheckbox checked={task.done || completing} celebrating={completing} onToggle={handleToggle} color={color} />

        </button>
      </div>
    </div>
  );

      onChange={e => setValue(e.target.value)}
      onKeyDown={e => { if (e.key === "Enter" && !e.nativeEvent.isComposing) submit(); if (e.key === "Escape") { setValue(""); onCancel?.(); } }}
      placeholder={placeholder || "What do you need to do?"} />
    {withDate && <DatePickerButton compact value={dueDate} onChange={setDueDate} />}
    <button type="button" className="quick-add-submit" aria-label="Add task" disabled={!value.trim() || (withDate && (!validISO(dueDate) || (repeat !== "none" && repeatUntil && repeatUntil < dueDate)))} onClick={submit}><Icon name="check" size={17} /></button>
    {withDate && <TaskAddOptions isEvent={isEvent} onChange={setIsEvent}>
      <EventTimeFields time={time} onTime={setTime} notify={notify} onNotify={setNotify} />
      <RepeatFields compact repeat={repeat} onRepeat={setRepeat} until={repeatUntil} onUntil={setRepeatUntil} startDate={dueDate} />
      {repeat !== "none" && repeatUntil && repeatUntil < dueDate && <p className="editor-error" role="alert">End date must be on or after the first event.</p>}
    </TaskAddOptions>}
  </div>;
}

function findPackForColor(color) {
  for (const pack of COLOR_PACKS) {
    if (pack.colors.includes(color)) return pack.key;
  }
  return COLOR_PACKS[0].key;
}

function isLightColor(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  // perceived brightness
  const brightness = (r * 299 + g * 587 + b * 114) / 1000;
  return brightness > 235;
}

function ColorPackPicker({ selectedColor, onSelect }) {
  const [activePack, setActivePack] = useState(() => findPackForColor(selectedColor));
  const pack = COLOR_PACKS.find(p => p.key === activePack) || COLOR_PACKS[0];

  return <div className="class-color-picker">
    <RoundedSelect label="Color palette" value={activePack} onChange={setActivePack}
      options={COLOR_PACKS.map(p => [p.key, p.label])} />
    <div className="class-color-grid" role="group" aria-label={`${pack.label} accent colors`}>
      {pack.colors.map(c => {
        const selected = selectedColor === c;
        const brightness = parseInt(c.slice(1,3),16)*.299 + parseInt(c.slice(3,5),16)*.587 + parseInt(c.slice(5,7),16)*.114;
        return <button type="button" className="class-color-choice" key={c} onClick={() => onSelect(c)}
          aria-label={`Set color ${c}`} aria-pressed={selected}
          style={{"--choice-color":c,"--choice-ink":brightness > 150 ? "#171715" : "#FFFFFF"}}>
          <span className="class-color-dot" aria-hidden="true">{selected && <Icon name="check" size={16} />}</span>
        </button>;
      })}
    </div>
  </div>;

}

/* ---------- due today warning banner ---------- */

function TodayFocus({ tasks, eventCount = 0 }) {
  const today = todayISO();
  const due = tasks.filter(t => t.dueDate === today);
  const done = due.filter(t => t.done).length;
  const left = due.length - done;
  const overdue = tasks.filter(t => !t.done && isOverdue(t.dueDate)).length;
  const percent = due.length ? Math.round(done / due.length * 100) : 0;
  return (
    <section className="focus-card" aria-label="Today's focus">
      <div className="focus-top">
        <div style={{ minWidth: 0 }}>
          <p className="eyebrow">{new Date().toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" })}</p>
          <h2 className="focus-title">{due.length ? (left ? `${left} ${left === 1 ? "task" : "tasks"} left today.` : "Today, taken care of.") : "One task at a time."}</h2>
        </div>
        <div className="focus-emblem" data-complete={due.length > 0 && !left} aria-hidden="true"><Icon name={due.length && !left ? "check" : "calendar"} size={23} /></div>
      </div>
      <p className="focus-copy">{overdue ? `${overdue} overdue ${overdue === 1 ? "task needs" : "tasks need"} a little attention.` : due.length ? (left ? "A little focus now. A lighter day ahead." : "Nice work. Enjoy a little breathing room.") : "Nothing due today. Plan ahead or take a breather."}</p>
      <div className="focus-event-count"><Icon name="calendar" size={14} /><span>{eventCount} {eventCount === 1 ? "event" : "events"} today</span></div>
      {due.length > 0 && <>
        <div className="focus-track" role="progressbar" aria-label="Tasks due today completed" aria-valuemin={0} aria-valuemax={due.length} aria-valuenow={done}><div className="focus-fill" style={{ width: `${percent}%` }} /></div>
        <div className="focus-meta"><span>{done} of {due.length} complete</span><span>{percent}%</span></div>
      </>}
    </section>
  );
}

function Dashboard({ classes, tasks, records = [], onOpenClass, onAddClass, onAddTask, onReorder, onToggleTask }) {
  const isMobile = useIsMobile();
  const [adding, setAdding] = useState(false);
  const [expandedId, setExpandedId] = useState(null);
  const [dragId, setDragId] = useState(null);
  const [dropIndex, setDropIndex] = useState(null);
  const dragOverIdRef = useRef(null);

  const classTasks = useMemo(() => {
    const m = {};
    classes.forEach(c => { m[c.id] = tasks.filter(t => t.classId === c.id && !t.done); });
    return m;
  }, [classes, tasks]);

  const handleDragStart = (id) => (e) => {
    setDragId(id);
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", id); } catch (err) {}
  };

  const handleDragOver = (id, index) => (e) => {
    e.preventDefault();
    dragOverIdRef.current = id;
    setDropIndex(index);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    if (dragId && dragOverIdRef.current && dragId !== dragOverIdRef.current) {
      onReorder(dragId, dragOverIdRef.current);
    }
    setDragId(null);
    setDropIndex(null);
    dragOverIdRef.current = null;
  };

  const handleDragEnd = () => {
    setDragId(null);
    setDropIndex(null);
    dragOverIdRef.current = null;
  };

  const focusToday = todayISO();
  const eventCount = useMemo(() => expandTasks(records, focusToday).filter(task => isCalendarOnly(task) && task.dueDate === focusToday && !task.deleted).length, [records, focusToday]);

  const streak = useMemo(() => computeStreak(tasks), [tasks]);

  return (
    <div className="screen" style={{ maxWidth: 640, margin: "0 auto", padding: "0 20px 100px" }}>
      <div style={{ padding: "28px 0 22px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>

        {streak >= 2 && (
          <div style={{
            display: "flex", alignItems: "center", gap: 5,
            background: "#D4884F1a", color: "#C67A3F",
            borderRadius: "var(--radius-iphone)", padding: "6px 12px",
            fontSize: 13, fontWeight: 700, flexShrink: 0,
          }}>
            <Icon name="flame" size={14} />
            {streak} day{streak === 1 ? "" : "s"}
          </div>
        )}
      </div>

      {(classes.length > 0 || tasks.length > 0 || eventCount > 0) && <TodayFocus tasks={tasks} eventCount={eventCount} />}
      {classes.length === 0 && (
        <div style={{ textAlign: "center", padding: "56px 20px", color: "var(--text-muted)" }}>
          <div className="empty-orbit" aria-hidden="true"><Icon name="grid" size={28} /></div>
          <div style={{ fontSize: 19, fontWeight: 650, marginBottom: 7, color: "var(--text-primary)" }}>A fresh start.</div>
          <div style={{ fontSize: 13.5 }}>Add your first class, club, or activity below to get started.</div>
        </div>
      )}

      <div className="class-list" style={{ display: "flex", flexDirection: "column", gap: 10 }} onDrop={handleDrop} onDragOver={e => e.preventDefault()}>
        {classes.map((cls, i) => (
          <div
            key={cls.id}
            style={{ "--arrival-delay": `${Math.min(i, 6) * 35}ms` }}
            draggable={!isMobile}
            onDragStart={handleDragStart(cls.id)}
            onDragOver={handleDragOver(cls.id, i)}
            onDragEnd={handleDragEnd}
          >
            <ClassCard
              cls={cls}
              activeTasks={classTasks[cls.id] || []}
              expanded={expandedId === cls.id}
              onToggleExpand={() => setExpandedId(id => id === cls.id ? null : cls.id)}
              onOpenFull={() => onOpenClass(cls.id)}
              onQuickAdd={(title, dueDate, options) => onAddTask(cls.id, title, dueDate, options)}
              onMoveUp={i > 0 ? () => onReorder(cls.id, classes[i - 1].id) : null}
              onMoveDown={i < classes.length - 1 ? () => onReorder(cls.id, classes[i + 1].id) : null}
              dragHandleProps={{ draggable: true, onDragStart: handleDragStart(cls.id) }}
              isDragging={dragId === cls.id}
              isDropTarget={dropIndex === i && dragId && dragId !== cls.id}
            />
          </div>
        ))}
      </div>

      <div style={{ marginTop: 14 }}>
        <button className="class-add-action" onClick={() => setAdding(true)} style={{
          display: "flex", alignItems: "center", gap: 8, width: "100%",
          padding: "13px 14px",
          background: "transparent", border: "1.5px dashed var(--border-strong)",
          borderRadius: "var(--radius-card)", color: "var(--text-secondary)",
          fontSize: 14.5, fontWeight: 500, cursor: "pointer",
        }}>
          <Icon name="plus" size={17} /> Add
        </button>
      </div>

      {adding && (
        <AddItemSheet
          onAdd={(name, category) => { onAddClass(name, category); setAdding(false); }}
          onClose={() => setAdding(false)}
        />
      )}
    </div>
  );
}

function SegmentedControl({ label, options, value, onChange }) {
  return <div className="segmented-control" role="group" aria-label={label}
    style={{ "--segment-count": options.length, "--active-segment": Math.max(0, options.findIndex(([key]) => key === value)) }}>
    <span className="segment-pill" aria-hidden="true" />
    {options.map(([key, text]) => <button key={key} type="button" aria-pressed={value === key} onClick={() => onChange(key)}>{text}</button>)}
  </div>;
}

function AllTasksScreen({ classes, tasks, onToggle, onDelete, onOpenClass, onEdit }) {
  const [viewMode, setViewMode] = useState("important");
  const [query, setQuery] = useState("");
  const trimmedQuery = query.trim().toLowerCase();
  const isSearching = trimmedQuery.length > 0;

  const classById = useMemo(() => {
    const m = {};
    classes.forEach(c => { m[c.id] = c; });
    return m;
  }, [classes]);

  const searchResults = useMemo(() => {
    if (!isSearching) return [];
    return tasks
      .filter(t => !isCalendarOnly(t)).filter(t => t.title.toLowerCase().includes(trimmedQuery))
      .sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        const ad = a.dueDate || "9999-99-99";
        const bd = b.dueDate || "9999-99-99";
        if (ad !== bd) return ad < bd ? -1 : 1;
        return b.createdAt - a.createdAt;
      });
  }, [tasks, trimmedQuery, isSearching]);

  const byClass = useMemo(() => {
    const groups = [...classes, { id: "", name: "General events", color: "var(--accent)" }]
      .map(c => {
        const items = tasks
          .filter(t => !isCalendarOnly(t)).filter(t => (c.id ? t.classId === c.id : !t.classId) && !t.done)
          .sort((a, b) => {
            const ad = a.dueDate || "9999-99-99";
            const bd = b.dueDate || "9999-99-99";
            if (ad !== bd) return ad < bd ? -1 : 1;
            return a.createdAt - b.createdAt;
          });
        return { cls: c, items };
      })
      .filter(g => g.items.length > 0);

    groups.sort((a, b) => {
      const ad = a.items[0].dueDate || "9999-99-99";
      const bd = b.items[0].dueDate || "9999-99-99";
      if (ad !== bd) return ad < bd ? -1 : 1;
      return 0;
    });

    return groups;
  }, [classes, tasks]);

  const importantTasks = useMemo(() => {
    const cutoff = tomorrowISO();
    return tasks
      .filter(t => !isCalendarOnly(t)).filter(t => !t.done && t.dueDate && t.dueDate <= cutoff)
      .sort((a, b) => {
        const ad = a.dueDate || "9999-99-99";
        const bd = b.dueDate || "9999-99-99";
        if (ad !== bd) return ad < bd ? -1 : 1;
        return a.createdAt - b.createdAt;
      });
  }, [tasks]);

  const total = byClass.reduce((n, g) => n + g.items.length, 0);

  return (
    <div className="screen" style={{ maxWidth: 640, margin: "0 auto", padding: "0 20px 100px" }}>
      <div style={{ padding: "28px 0 16px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
        <h1 style={{ fontSize: 28, fontWeight: 700, letterSpacing: "-0.02em", margin: 0 }}>Tasks</h1>
        {!isSearching && (
          <SegmentedControl label="Task filter" options={[["important", "Important"], ["all", "All"]]} value={viewMode} onChange={setViewMode} />
        )}
      </div>

      <div className="search-field" style={{
        display: "flex", alignItems: "center", gap: 8, marginBottom: 20,
        background: "var(--surface)", border: "1px solid var(--border)",
        borderRadius: "var(--radius-control)", padding: "10px 13px",
      }}>
        <Icon name="search" size={16} style={{ color: "var(--text-muted)", flexShrink: 0 }} />
        <input
          value={query}
          onChange={e => setQuery(e.target.value)}
          placeholder="Search tasks"
          style={{
            flex: 1, border: "none", outline: "none", background: "transparent",
            fontSize: 14.5, color: "var(--text-primary)", fontFamily: "inherit",
          }}
        />
        {query && (
          <button onClick={() => setQuery("")} aria-label="Clear search" style={{
            background: "none", border: "none", cursor: "pointer", color: "var(--text-muted)",
            display: "flex", padding: 2,
          }}>
            <Icon name="x" size={14} />
          </button>
        )}
      </div>

      <p className="task-edit-hint">Hold a task to edit, or tap its pencil.</p>
      {isSearching ? (
        searchResults.length === 0 ? (
          <div style={{ textAlign: "center", padding: "40px 20px", color: "var(--text-muted)", fontSize: 14.5 }}>
            No tasks match "{query.trim()}"
          </div>
        ) : (
          <div className="task-card-list">
            {searchResults.map(t => <CalendarEvent key={t.id} task={t} cls={classById[t.classId]} onToggle={onToggle} onEdit={onEdit} onDelete={onDelete} showDate />)}
          </div>
        )
      ) : viewMode === "important" ? (
        importantTasks.length === 0 ? (
          <div style={{ textAlign: "center", padding: "48px 20px", color: "var(--text-muted)", fontSize: 15 }}>
            Nothing due today or tomorrow.
          </div>
        ) : (
          <div className="task-card-list">
            {importantTasks.map(t => <CalendarEvent key={t.id} task={t} cls={classById[t.classId]} onToggle={onToggle} onEdit={onEdit} onDelete={onDelete} showDate />)}
          </div>
        )
      ) : (
        <>
          {total === 0 && (
            <div style={{ textAlign: "center", padding: "48px 20px", color: "var(--text-muted)", fontSize: 15 }}>
              Nothing due anywhere. Enjoy it.
            </div>
          )}

          {byClass.map(({ cls, items }) => (
            <div key={cls.id} style={{ marginBottom: 22 }}>
              <button disabled={!cls.id} onClick={() => onOpenClass(cls.id)} style={{
                display: "flex", alignItems: "center", gap: 8, background: "none", border: "none",
                cursor: cls.id ? "pointer" : "default", opacity: 1, padding: "0 0 8px", color: "var(--text-primary)",
              }}>
                <div style={{ width: 8, height: 8, borderRadius: "50%", background: cls.color }} />
                <span style={{ fontSize: 14.5, fontWeight: 600 }}>{cls.name}</span>
                <span style={{ fontSize: 13, color: "var(--text-muted)" }}>{items.length}</span>
              </button>
              <div className="task-card-list">
                {items.map(t => (
                  <CalendarEvent key={t.id} task={t} cls={cls} onToggle={onToggle} onEdit={onEdit} onDelete={onDelete} showDate />
                ))}
              </div>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

function TimeWheel({ label, options, value, onChange, open }) {
  const list = useRef(null);
  const selectedIndex = options.indexOf(value);
  const lastIndex = useRef(selectedIndex);
  const interacting = useRef(false);
  const settleTimer = useRef(null);
  const ignoredUntil = useRef(0);
  const id = React.useId();
  useEffect(() => () => clearTimeout(settleTimer.current), []);
  useEffect(() => {
    if (!open) { interacting.current = false; clearTimeout(settleTimer.current); return; }
    if (!list.current || interacting.current) return;
    lastIndex.current = selectedIndex;
    ignoredUntil.current = performance.now() + 60;
    list.current.scrollTop = Math.max(0, selectedIndex) * 44;
  }, [open, selectedIndex]);
  const select = index => {
    index = Math.max(0, Math.min(options.length - 1, index));
    if (index === lastIndex.current) return;
    lastIndex.current = index;
    vibrate(5);
    onChange(options[index]);
  };
  const scroll = () => {
    if (!open || performance.now() < ignoredUntil.current) return;
    interacting.current = true;
    select(Math.round(list.current.scrollTop / 44));
    clearTimeout(settleTimer.current);
    settleTimer.current = setTimeout(() => { interacting.current = false; }, 160);
  };
  return <div className="time-picker-column"><span>{label}</span>
    <div className="time-wheel-frame"><div className="time-wheel-band" aria-hidden="true" />
      <div ref={list} className="time-wheel" role="listbox" tabIndex={0} aria-label={label} aria-activedescendant={`${id}-${Math.max(0,selectedIndex)}`} onScroll={scroll} onPointerDown={() => { ignoredUntil.current = 0; }} onWheel={() => { ignoredUntil.current = 0; }} onKeyDown={e => {
        const moves = {ArrowDown:1,ArrowUp:-1,PageDown:5,PageUp:-5};
        let index = e.key === "Home" ? 0 : e.key === "End" ? options.length - 1 : e.key in moves ? lastIndex.current + moves[e.key] : null;
        if (index === null) return;
        e.preventDefault(); index = Math.max(0,Math.min(options.length - 1,index));
        interacting.current = true; select(index);
        list.current.scrollTo({top:index * 44,behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
      }}>
        {options.map((option,index) => <div id={`${id}-${index}`} key={option} role="option" aria-selected={option === value} className="time-wheel-option" onClick={() => {
          interacting.current = true; select(index); list.current.scrollTo({top:index * 44,behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
        }}>{option}</div>)}
      </div>
    </div>
  </div>;
}

function EventTimePicker({ value, onChange }) {
  const picker = useRef(null);
  const [open, setOpen] = useState(false);
  const current = useRef(value);
  current.current = value;
  const selected = validEventTime(value) ? value : "09:00";
  const [hour, minute] = selected.split(":").map(Number);
  const period = hour >= 12 ? "PM" : "AM";
  const change = (part, next) => {
    const [currentHour,currentMinute] = (validEventTime(current.current) ? current.current : "09:00").split(":").map(Number);
    let h = currentHour, m = currentMinute;
    if (part === "hour") h = Number(next) % 12 + (currentHour >= 12 ? 12 : 0);
    if (part === "minute") m = Number(next);
    if (part === "period") h = currentHour % 12 + (next === "PM" ? 12 : 0);
    current.current = `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
    onChange(current.current);
  };
  const columns = [
    {key:"hour", label:"Hour", value:String(hour % 12 || 12), options:Array.from({length:12},(_,i)=>String(i+1))},
    {key:"minute", label:"Minute", value:String(minute).padStart(2,"0"), options:Array.from({length:60},(_,i)=>String(i).padStart(2,"0"))},
    {key:"period", label:"AM / PM", value:period, options:["AM","PM"]}
  ];
  return <details className="rounded-select event-time-picker" ref={picker} onKeyDown={e => {
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); picker.current.open = false; picker.current.querySelector("summary").focus(); }
  }} onToggle={e => setOpen(e.currentTarget.open)}>
    <summary aria-label={`Event time: ${value ? formatEventTime(value) : "all-day"}`}><span>{value ? formatEventTime(value) : "Choose time"}</span><Icon name="clock" size={18} /></summary>
    <div className="time-picker-panel">
      <div className="time-picker-columns">{columns.map(column => <TimeWheel key={column.key} label={column.label} options={column.options} value={column.value} open={open} onChange={next => change(column.key,next)} />)}</div>
      <button className="primary-action" type="button" onClick={() => { if (!value) onChange(selected); picker.current.open = false; picker.current.querySelector("summary").focus(); }}>Done</button>
    </div>
  </details>;
}

    <p className="editor-hint">{time ? "Reminders appear while this app is open. Background phone notifications aren't connected yet." : "Leave the time blank for an all-day event. Choose a time to enable an in-app reminder."}</p>

function ReminderCenter({ records }) {
  const [reminder, setReminder] = useState(null);
  const seen = useRef(null);
  if (!seen.current) {
    try { seen.current = new Set(JSON.parse(localStorage.getItem("classesApp.remindersShown.v1") || "[]")); }
    catch { seen.current = new Set(); }
  }
  useEffect(() => {
    const check = () => {
      if (document.visibilityState !== "visible" || reminder) return;
      const next = dueReminders(records, new Date()).find(task => !seen.current.has(reminderKey(task)));
      if (!next) return;
      seen.current.add(reminderKey(next));
      try { localStorage.setItem("classesApp.remindersShown.v1", JSON.stringify([...seen.current].slice(-1000))); } catch {}
      setReminder(next);
    };
    check();
    const timer = setInterval(check, 15000);
    document.addEventListener("visibilitychange", check);
    return () => { clearInterval(timer); document.removeEventListener("visibilitychange", check); };
  }, [records, reminder]);
  useEffect(() => {
    if (!reminder) return;
    const current = resolveTask(records, reminder.id);
    if (!current || (current.done && !current.autoCompleted) || current.deleted || !current.notify || current.time !== reminder.time || current.dueDate !== reminder.dueDate) setReminder(null);
  }, [records, reminder]);
  if (!reminder) return null;
  return <aside className="event-reminder" role="alert" aria-label="Event reminder">
    <Icon name="calendar" size={22} /><div><span className="reminder-heading">Event reminder · {formatEventTime(reminder.time)}</span><strong>{reminder.title}</strong></div>
    <button type="button" className="quiet-icon" aria-label="Dismiss reminder" onClick={() => setReminder(null)}><Icon name="x" size={18} /></button>
  </aside>;
}

function RoundedSelect({ value, onChange, options, disabled = false, label = "Choose an option", style }) {
  const menu = useRef(null);

  }}>
    <summary aria-label={label} aria-disabled={disabled} onClick={e => { if (disabled) e.preventDefault(); }}>
      <span>{selected ? selected[1] : "Choose an option"}</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
    </summary>
    {!disabled && <div className="rounded-select-menu" role="group" aria-label={label}>
      {options.map(([key, text]) => <button type="button" key={key} aria-pressed={key === value} onClick={() => {
        onChange(key); menu.current.open = false; menu.current.querySelector("summary").focus();
      }}><span>{text}</span>{key === value && <Icon name="check" size={16} />}</button>)}

function RepeatFields({ repeat, onRepeat, until, onUntil, startDate, disabled = false, compact = false }) {
  const custom = customRepeat(repeat);
  const defaults = { frequency: "weekly", interval: 1, days: [validISO(startDate) ? dateFromISO(startDate).getDay() : 1], ordinal: "1" };
  const updateCustom = patch => onRepeat(customRepeatValue({ ...(custom || defaults), ...patch }));
  return <div className={`repeat-fields ${compact ? "compact-repeat" : ""}`}>
    <div className="field-label"><span>Repeat</span>
      <RoundedSelect label="Repeat schedule" value={custom ? "custom" : repeat} onChange={value => onRepeat(value === "custom" ? customRepeatValue(defaults) : value)} disabled={disabled} options={[...REPEAT_OPTIONS, ["custom", "Custom…"]]} />
    </div>
    {custom && <div className="custom-repeat-panel">
      <div className="field-label"><span>Frequency</span><RoundedSelect label="Repeat frequency" disabled={disabled} value={custom.frequency} onChange={frequency => updateCustom({ frequency })} options={[["weekly","Weekly"],["monthly","Monthly"]]} /></div>
      <div className="field-label"><span>Repeat every</span><RoundedSelect label="Repeat interval" disabled={disabled} value={String(custom.interval)} onChange={interval => updateCustom({ interval: Number(interval) })} options={Array.from({length:12}, (_,i) => [String(i+1), `${i+1} ${custom.frequency === "weekly" ? i ? "weeks" : "week" : i ? "months" : "month"}`])} /></div>
      {custom.frequency === "monthly" && <div className="field-label"><span>Which week</span><RoundedSelect label="Week of the month" disabled={disabled} value={custom.ordinal} onChange={ordinal => updateCustom({ordinal})} options={[["1","First"],["2","Second"],["3","Third"],["4","Fourth"],["last","Last"]]} /></div>}
      <fieldset className="repeat-weekdays" disabled={disabled}><legend>On these days</legend><div>
        {[1,2,3,4,5,6,0].map(day => <button type="button" key={day} aria-label={["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][day]} aria-pressed={custom.days.includes(day)} onClick={() => {
          const days = custom.days.includes(day) ? custom.days.filter(d => d !== day) : [...custom.days,day];
          if (days.length) updateCustom({ days: days.sort((a,b) => ((a+6)%7)-((b+6)%7)) });
        }}>{["S","M","T","W","T","F","S"][day]}</button>)}
      </div></fieldset>
      <p className="editor-hint">{custom.frequency === "monthly" ? `On the ${custom.ordinal === "last" ? "last" : ["","first","second","third","fourth"][Number(custom.ordinal)]} selected weekdays of each scheduled month.` : "Weeks start on Monday."} Starts on or after the event date. Keep at least one day selected.</p>
    </div>}
    {repeat !== "none" && <label className="field-label"><span>End date <span className="field-optional">(optional)</span></span>
      <input aria-label="Repeat end date" type="date" value={until} min={startDate} onChange={e => onUntil(e.target.value)} disabled={disabled} />
    </label>}
  </div>;
}

function CalendarEvent({ task, cls, onToggle, onEdit, onDelete, showDate = false, compact = false, dense = false }) {
  const timer = useRef(null);
  const origin = useRef(null);
  const swipeAxis = useRef(null);
  const swipeDelta = useRef(0);
  const [pressing, setPressing] = useState(false);
  const [dragX, setDragX] = useState(0);
  const stopHold = () => { clearTimeout(timer.current); setPressing(false); };
  const cancel = () => { stopHold(); origin.current = null; swipeAxis.current = null; swipeDelta.current = 0; setDragX(0); };
  useEffect(() => () => clearTimeout(timer.current), []);
  const start = e => {
    cancel();
    if (e.button !== 0 || e.target.closest('[data-event-action]')) return;
    origin.current = { x: e.clientX, y: e.clientY };
    setPressing(true);
    timer.current = setTimeout(() => { origin.current = null; setPressing(false); vibrate(15); onEdit(task); }, 500);
  };
  const move = e => {
    if (!origin.current) return;
    const dx = e.clientX - origin.current.x, dy = e.clientY - origin.current.y;
    if (Math.hypot(dx,dy) > 10) stopHold();
    if (!onDelete) return;
    if (!swipeAxis.current && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      swipeAxis.current = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      stopHold();
    }
    if (swipeAxis.current === "x") { swipeDelta.current = Math.max(-110,Math.min(110,dx)); setDragX(swipeDelta.current); }
  };
  const finish = () => {
    const point = origin.current, delta = swipeDelta.current, horizontal = swipeAxis.current === "x";
    cancel();
    if (!onDelete || !horizontal) return;
    if (delta >= SWIPE_THRESHOLD && !task.done) onToggle(task.id,point);
    else if (delta <= -SWIPE_THRESHOLD) onDelete(task.id);
  };
  const toggle = e => {
    const r = e.currentTarget.getBoundingClientRect();
    onToggle(task.id, { x: r.left + r.width / 2, y: r.top + r.height / 2 });
  };
  return <article className={`calendar-event ${compact ? "event-compact" : ""} ${dense ? "event-dense" : ""}`} data-done={task.done} data-pressing={pressing} data-swiping={dragX !== 0}
    style={{ "--event-color": cls ? cls.color : "var(--accent)", "--swipe-x": `${dragX}px` }}
    onPointerDown={start} onPointerMove={move} onPointerUp={finish} onPointerCancel={cancel} onPointerLeave={cancel}
    onContextMenu={e => e.preventDefault()}>
    <label className="event-check-target" data-event-action="true">

function CalendarScreen({ classes, records, onToggle, onEdit, onDateChange }) {
  const [viewMode, setViewMode] = useState(() => window.innerWidth < 640 ? "day" : "month");
  const [selectedDate, setSelectedDate] = useState(todayISO());
  const [cursor, setCursor] = useState(() => ({ year: new Date().getFullYear(), month: new Date().getMonth() }));
  useEffect(() => { onDateChange(selectedDate); }, [selectedDate, onDateChange]);
  const today = todayISO();
  const selected = dateFromISO(selectedDate);
  const classesById = useMemo(() => Object.fromEntries(classes.map(c => [c.id,c])), [classes]);
  const through = isoFromDate(new Date(cursor.year, cursor.month + 1, 7));
  const tasks = useMemo(() => expandTasks(records, through > selectedDate ? through : shiftISO(selectedDate, 7)), [records, through, selectedDate]);
  const byDate = useMemo(() => {
    const grouped = {};
    tasks.forEach(t => { if (t.dueDate) (grouped[t.dueDate] = grouped[t.dueDate] || []).push(t); });
    Object.values(grouped).forEach(list => list.sort((a,b) => Number(a.done) - Number(b.done) || (a.time || "").localeCompare(b.time || "") || a.createdAt - b.createdAt));
    return grouped;
  }, [tasks]);
  const selectDate = iso => { setSelectedDate(iso); const d = dateFromISO(iso); setCursor({year:d.getFullYear(),month:d.getMonth()}); };
  const move = delta => {
    if (viewMode !== "month") { selectDate(shiftISO(selectedDate, delta * (viewMode === "week" ? 7 : 1))); return; }
    const d = new Date(cursor.year, cursor.month + delta, 1);
    const day = Math.min(selected.getDate(), new Date(d.getFullYear(), d.getMonth()+1, 0).getDate());
    selectDate(isoFromDate(new Date(d.getFullYear(), d.getMonth(), day)));
  };
  const weekStart = shiftISO(selectedDate, -selected.getDay());
  const week = Array.from({length:7}, (_,i) => shiftISO(weekStart,i));
  const first = new Date(cursor.year,cursor.month,1).getDay();
  const days = new Date(cursor.year,cursor.month+1,0).getDate();
  const monthCells = Array.from({length:first+days}, (_,i) => i < first ? null : isoFromDate(new Date(cursor.year,cursor.month,i-first+1)));
  const heading = viewMode === "month" ? new Date(cursor.year,cursor.month,1).toLocaleDateString(undefined,{month:"long",year:"numeric"}) : viewMode === "week" ? `${dateFromISO(week[0]).toLocaleDateString(undefined,{month:"short",day:"numeric"})} – ${dateFromISO(week[6]).toLocaleDateString(undefined,{month:"short",day:"numeric"})}` : selected.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
  const events = (iso, compact = false, dense = false) => (byDate[iso] || []).map(t => <CalendarEvent key={t.id} task={t} cls={classesById[t.classId]} onToggle={onToggle} onEdit={onEdit} compact={compact} dense={dense} />);
  return <div className="screen calendar-screen" style={{maxWidth:760,margin:"0 auto",padding:"0 20px 100px"}}>
    <header className="calendar-heading"><h1>Calendar</h1><SegmentedControl label="Calendar view" options={[["day", "Day"], ["week", "Week"], ["month", "Month"]]} value={viewMode} onChange={setViewMode} /></header>
    <div className="calendar-controls"><button className="quiet-icon" aria-label="Previous" onClick={()=>move(-1)}><Icon name="chevron" size={18} style={{transform:"rotate(180deg)"}} /></button><button onClick={()=>selectDate(today)} aria-label={`${heading}. Go to today`}>{heading}</button><button className="quiet-icon" aria-label="Next" onClick={()=>move(1)}><Icon name="chevron" size={18} /></button></div>
    <p className="calendar-hint">Hold an event to edit · Check to complete</p>
    {viewMode === "month" && <div className="calendar-month">
      <div className="month-labels">{["S","M","T","W","T","F","S"].map((label,i)=><span key={i}>{label}</span>)}</div>
      <div className="month-cells">{monthCells.map((iso,i)=>iso ? <div key={iso} className="month-cell" data-selected={iso===selectedDate} data-today={iso===today}>
        <button className="month-date" aria-label={dateFromISO(iso).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})} aria-pressed={iso===selectedDate} onClick={()=>selectDate(iso)}><span className="month-day-number">{dateFromISO(iso).getDate()}</span><span className="month-dots" aria-hidden="true">{(byDate[iso]||[]).slice(0,3).map(t=><i key={t.id} style={{background:classesById[t.classId]?.color||"var(--accent)"}} />)}</span></button>
        <div className="month-inline-events">{(byDate[iso]||[]).slice(0,2).map(t=><CalendarEvent key={t.id} task={t} cls={classesById[t.classId]} onToggle={onToggle} onEdit={onEdit} compact />)}{(byDate[iso]||[]).length>2 && <button className="more-events" onClick={()=>selectDate(iso)}>+{byDate[iso].length-2} more</button>}</div>
      </div> : <div key={`empty-${i}`} />)}</div>
    </div>}
    {viewMode === "week" ? <div className="calendar-week">{week.map(iso=><section className="week-day" data-today={iso===today} key={iso}>
      <button className="week-day-label" aria-label={`${dateFromISO(iso).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}${iso===today?", Today":""}`} onClick={()=>{selectDate(iso);setViewMode("day");}}><span>{dateFromISO(iso).toLocaleDateString(undefined,{weekday:"short"})}</span><strong>{dateFromISO(iso).getDate()}</strong></button>
      <div className="week-events">{events(iso, false, true)}{!(byDate[iso]||[]).length && <p className="calendar-empty-day">Nothing scheduled</p>}</div>
    </section>)}</div> : <section className="calendar-agenda" aria-label="Events for selected date">
      {viewMode === "month" && <h2>{selectedDate === today ? "Today" : selected.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}</h2>}
      {events(selectedDate)}{!(byDate[selectedDate]||[]).length && <div className="calendar-empty"><Icon name="calendar" size={30}/><p>A little breathing room.</p><span>Tap + to add something for this day.</span></div>}
    </section>}
  </div>;
}

function NavBar({ tab, setTab }) {
  const items = [
    { key: "classes", label: "Classes", icon: "grid" },
    { key: "all", label: "All tasks", icon: "list" },
    { key: "calendar", label: "Calendar", icon: "calendar" },
    { key: "settings", label: "Settings", icon: "settings" },
  ];
  const active = Math.max(0, items.findIndex(item => item.key === tab));
  const [position, setPosition] = useState(null);
  const gesture = useRef(null);
  const suppressClick = useRef(false);
  const trackRef = useRef(null);
  const positionAt = clientX => {
    const box = trackRef.current.getBoundingClientRect();
    const cell = (box.width - 12) / items.length;
    return Math.max(0, Math.min(items.length - 1, (clientX - box.left - 6) / cell - .5));
  };
  const endDrag = (event, cancelled = false) => {
    const current = gesture.current;
    if (!current || current.id !== event.pointerId) return;
    gesture.current = null;
    // Capture may retarget touch-up away from the original button, so commit
    // taps here too rather than depending on a subsequent button click.
    if (!cancelled) setTab(items[Math.round(positionAt(event.clientX))].key);
    suppressClick.current = true;
    if (current.dragged) {
      if (event.currentTarget.hasPointerCapture(event.pointerId)) event.currentTarget.releasePointerCapture(event.pointerId);
      // Keep suppression until the compatibility click or the next new gesture.
      // iOS can deliver that click after a zero-delay timer has already run.
    }
    setPosition(null);
  };
  return <nav className="bottom-nav" aria-label="Main navigation" style={{
    position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 30,
    display: "flex", justifyContent: "center",
    padding: "0 20px calc(20px + env(safe-area-inset-bottom, 0px))", pointerEvents: "none",
  }}>
    <div ref={trackRef} className="nav-track" data-dragging={position !== null}
      onPointerDown={event => {
        if (!event.isPrimary || event.button !== 0) return;
        suppressClick.current = false;
        gesture.current = {id:event.pointerId,x:event.clientX,y:event.clientY,dragged:false};
        // Touch starts on a child button; transfer its implicit capture to the track.
        event.currentTarget.setPointerCapture(event.pointerId);
      }}
      onPointerMove={event => {
        const current = gesture.current;
        if (!current || current.id !== event.pointerId) return;
        if (!current.dragged) {
          if (Math.abs(event.clientY-current.y) > Math.abs(event.clientX-current.x)+6) { gesture.current=null; return; }
          if (Math.abs(event.clientX-current.x) < 5) return;
          current.dragged=true;
          event.currentTarget.setPointerCapture(event.pointerId);
        }
        setPosition(positionAt(event.clientX));
      }}
      onPointerUp={event => endDrag(event)}
      onPointerCancel={event => endDrag(event,true)}
      onLostPointerCapture={event => { if (event.target === event.currentTarget && gesture.current?.id === event.pointerId) { gesture.current=null; setPosition(null); } }}
      onClickCapture={event => {if(suppressClick.current && event.detail !== 0){suppressClick.current=false;event.preventDefault();event.stopPropagation();}}}
      style={{"--active-tab":position === null ? active : position,display:"flex",gap:0,background:"var(--surface-raised)",border:"1px solid var(--border)",borderRadius:"var(--radius-iphone)",padding:6,boxShadow:"var(--shadow-lift)",pointerEvents:"auto",backdropFilter:"blur(20px)"}}>
      <div className="nav-pill" aria-hidden="true" />
      {items.map((item,index) => <button type="button" key={item.key} aria-label={item.label} aria-current={tab===item.key ? "page" : undefined}
        onClick={()=>setTab(item.key)} onKeyDown={event=>{
          if(!["ArrowLeft","ArrowRight","Home","End"].includes(event.key))return;
          event.preventDefault();
          const next=event.key==="Home"?0:event.key==="End"?items.length-1:(index+(event.key==="ArrowRight"?1:-1)+items.length)%items.length;
          setTab(items[next].key);trackRef.current.querySelectorAll("button")[next].focus();
        }} style={{display:"flex",alignItems:"center",gap:7,padding:"10px 16px",borderRadius:"var(--radius-iphone)",border:0,cursor:"pointer",background:"transparent",color:"var(--text-secondary)",fontSize:13.5,fontWeight:600,position:"relative"}}>
        <Icon name={item.icon} size={17}/><span>{item.label}</span>
      </button>)}
      <div className="nav-ink" aria-hidden="true">
        {items.map(item => <span className="nav-ink-label" key={item.key}><Icon name={item.icon} size={17}/><span>{item.label}</span></span>)}
      </div>
    </div>
  </nav>;
}
